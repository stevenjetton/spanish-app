<body>

<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; sea teal with mango highlights and a banig-weave mark */
:root {
  --bg: #f2f6f4;
  --surface: #ffffff;
  --surface-2: #e3ede9;
  --fg: #13241f;
  --muted: #55675f;
  --line: #d0ded9;
  --accent: #0e6e6a;      /* capiz-shell teal */
  --accent-ink: #ffffff;
  --accent-soft: #d3eeea;
  --sun: #f4a81d;         /* carabao mango */
  --sun-soft: #fdf0cf;
  --good: #1f8a5b;
  --good-soft: #d8f1e5;
  --bad: #c0392b;
  --bad-soft: #f9dcd8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1614; --surface: #14211f; --surface-2: #1d2f2b; --fg: #e5f0ec; --muted: #91a8a1; --line: #29403b;
    --accent: #5cc9bf; --accent-ink: #07201c; --accent-soft: #18403b; --sun: #f5c04a; --sun-soft: #3a3020;
    --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1614; --surface: #14211f; --surface-2: #1d2f2b; --fg: #e5f0ec; --muted: #91a8a1; --line: #29403b;
  --accent: #5cc9bf; --accent-ink: #07201c; --accent-soft: #18403b; --sun: #f5c04a; --sun-soft: #3a3020;
  --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.tile { width: 26px; height: 26px; border-radius: 6px; background: repeating-linear-gradient(45deg, var(--accent) 0 5px, transparent 5px 10px), repeating-linear-gradient(-45deg, var(--sun) 0 5px, var(--accent-soft) 5px 10px); }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.sun { background: var(--sun-soft); border-color: transparent; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main section { display: grid; gap: 16px; padding-block: 6px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.sun { background: var(--sun); color: #2a1d00; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.9rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.speak { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.speak svg { width: 20px; height: 20px; fill: currentColor; }

/* home */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 20px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; opacity: 0.18;
  background: radial-gradient(circle, var(--accent-ink) 0 14%, transparent 15%) 0 0 / 35px 35px; }
.hero .big { font-family: var(--font-display); font-size: 1.55rem; font-weight: 800; line-height: 1.15; }
.meter { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent-ink) 25%, transparent); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .4s; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 0.75rem; color: var(--muted); }
.week i { display: block; height: 34px; border-radius: 8px; background: var(--surface-2); margin-bottom: 4px; position: relative; overflow: hidden; }
.week i > s { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); text-decoration: none; }
.week .today { color: var(--fg); font-weight: 700; }
.pod { display: grid; gap: 6px; }
.pod .es { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.action { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.action b { font-family: var(--font-display); font-size: 1.05rem; }

/* flashcard */
.deck { text-align: left; display: grid; gap: 6px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.deck .count { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck .bar { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.deck .bar i { display: block; height: 100%; background: var(--good); }
.flash { perspective: 1200px; min-height: 280px; }
.flash .inner { position: relative; min-height: 280px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; }
.face.rear { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
.face .term { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.face .note { font-size: 0.92rem; color: var(--muted); max-width: 34ch; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { border: 0; border-radius: 12px; padding: 10px 4px; font-weight: 700; display: grid; gap: 1px; background: var(--surface-2); }
.rate button small { font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.rate .again { background: var(--bad-soft); }
.rate .good { background: var(--good-soft); }
@media (prefers-reduced-motion: reduce) { .flash .inner, .meter > i { transition: none; } }

/* stories */
.story-list { display: grid; gap: 10px; }
.story-item { text-align: left; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.lvl { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--sun-soft); }
.done-tag { font-size: 0.75rem; font-weight: 700; color: var(--good); }
.sent { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; font-size: 1.12rem; line-height: 1.55; }
.sent:hover { background: var(--surface-2); }
.sent .en { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 4px; font-style: italic; }
.sent.speaking { background: var(--sun-soft); }
.gloss { display: grid; gap: 6px; }
.gloss-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gloss-row:last-child { border-bottom: 0; }
.gloss-row .w { font-weight: 700; flex: 1; min-width: 0; }
.add { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 0.82rem; font-weight: 700; }
.add[disabled] { color: var(--good); border-color: transparent; background: var(--good-soft); }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 1.02rem; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.prompt-big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
input[type="text"], textarea, select { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.conj { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.conj td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--muted); width: 45%; }
.accents { display: flex; gap: 6px; flex-wrap: wrap; }
.accents button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 38px; padding: 6px 8px; font-weight: 700; }

/* phrasebook */
.phrase { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.phrase:last-child { border-bottom: 0; }
.phrase .txt { flex: 1; min-width: 0; }
.phrase .txt b { display: block; font-size: 1.05rem; }
.phrase .txt span { color: var(--muted); font-size: 0.92rem; }

.rp-affix { color: var(--accent); font-weight: 800; }
.rp-copy { background: var(--sun-soft); border-radius: 4px; padding: 0 1px; }
.rp-change { text-decoration: underline wavy var(--bad); text-underline-offset: 3px; }
.root-card { display: grid; gap: 4px; justify-items: start; }
.root-word { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.route-step { display: grid; gap: 2px; padding-left: 16px; border-left: 3px solid var(--accent-soft); }
.route-form, .slot-form { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; overflow-wrap: anywhere; }
.slots { display: grid; gap: 8px; }
.slot { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 2px dashed var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; min-height: 64px; }
.slot.active { border-color: var(--accent); border-style: solid; }
.slot.filled { border-style: solid; border-color: var(--good); background: var(--good-soft); cursor: default; opacity: 1; }
.slot-label { display: grid; gap: 2px; min-width: 0; }
.slot-form { font-size: 1.3rem; color: var(--muted); }
.slot.filled .slot-form { color: var(--fg); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.pool-chip { font-size: 1.05rem; padding: 10px 14px; }
.pool-chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.btn:disabled { opacity: .45; }
.mini { flex: none; border: 0; border-radius: 999px; min-width: 40px; height: 40px; display: grid; place-items: center; font-weight: 700; padding: 0 10px; }
.mic-s { background: var(--accent); color: var(--accent-ink); }
.mic-s svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.mic-s.on { background: var(--bad); }
.mini.said { background: var(--surface-2); color: var(--fg); font-size: 0.85rem; }
.mini.play { background: var(--good-soft); color: var(--good); min-width: 36px; height: 36px; }
.mini-done { display: inline-flex; align-items: center; gap: 8px; color: var(--good); font-weight: 800; }
.say-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.say-row:last-of-type { border-bottom: 0; }
.word-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.word-line > :first-child { min-width: 0; }
.tools { flex: none; display: inline-flex; align-items: center; gap: 6px; }
.g-link { display: inline-flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--accent); font-size: 0.8rem; font-weight: 700; text-decoration: none; }
.say-word { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.mic { justify-self: center; width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 0 0 0 var(--accent-soft); }
.mic svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.mic.on { background: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .mic.on { animation: pulse 1.2s infinite; } @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--bad-soft); } 100% { box-shadow: 0 0 0 22px transparent; } } }
.sp-rate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sp-skip { justify-self: center; background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px; }
.sp-answer { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; color: var(--accent); line-height: 1.2; }
.hear { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.hear a { font-weight: 700; }
.seg-t { font-weight: 700; color: var(--accent); }
.seg.now { background: var(--sun-soft); border-radius: 4px; box-shadow: 0 0 0 2px var(--sun-soft); }
details summary { cursor: pointer; }
.composer input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; justify-self: start; }
.tip { background: var(--sun-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="tile" aria-hidden="true"></span>Tara Usap</div>
    <div class="pills">
      <span class="pill sun" title="Day streak" id="streakPill">🔥 0</span>
      <span class="pill" title="Points today" id="xpPill">0 pts</span>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Ngayon</button>

</nav>

<script>
"use strict";
/* ================= CONTENT ================= */
// Every card's 4th field names the published source it was checked against (see SRC).
const SRC = {
  tng: ["TagalogNow: Tagalog greetings", "https://tagalognow.com/learn/common-tagalog-greetings"],
  tnm: ["TagalogNow: Mano po and Filipino etiquette", "https://www.tagalognow.com/learn/mano-po-and-filipino-etiquette/"],
  tn:  ["TagalogNow dictionary", "https://www.tagalognow.com/dictionary/"],
  tnv: ["TagalogNow: Verb aspects made simple", "https://www.tagalognow.com/learn/tagalog-verb-conjugation-aspects/"],
  tc:  ["Tagalog.com dictionary", "https://www.tagalog.com/dictionary/"],
  tct: ["Tagalog.com: Telling time", "https://tagalog.com/lessons/telling-time-anong-horas-na.php"],
  om:  ["Omniglot: Useful Tagalog phrases", "https://omniglot.com/language/phrases/tagalog.php"],
  fp:  ["FilipinoPod101: Commuting in the Philippines", "https://www.filipinopod101.com/lesson/absolute-beginner-16-commuting-in-the-philippines"],
  fpc: ["FilipinoPod101: Classroom phrases", "https://www.filipinopod101.com/lesson/all-about-14-top-5-filipino-classroom-phrases"],
  fpr: ["FilipinoPod101: Finding a bathroom", "https://filipinopod101.com/lesson/survival-phrases-6-how-to-say-where-is-the-bathroom-in-filipino"],
  fpd: ["FilipinoPod101: Restaurant phrases", "https://www.filipinopod101.com/blog/2022/09/09/filipino-restaurant-phrases/"],
  fps: ["FilipinoPod101: Explaining symptoms", "https://www.filipinopod101.com/lesson/survival-phrases-45-explaining-symptoms-in-filipino"],
  fpt: ["FilipinoPod101: Telling time", "https://www.filipinopod101.com/blog/2020/07/31/telling-time-in-filipino/"],
  fpb: ["FilipinoPod101: Beginner phrases", "https://www.filipinopod101.com/blog/2022/01/28/filipino-beginner-phrases/"],
  sl:  ["TheSmartLocal: Filipino food phrases", "https://thesmartlocal.ph/filipino-food-phrases/"],
  slb: ["TheSmartLocal: Basic Filipino phrases", "https://thesmartlocal.ph/basic-filipino-phrases/"],

  ["Kuya, Ate, Tito, Lolo: match the age", "Kuya and Ate are for people a bit older than you. Someone your parents' age is Tito or Tita, and grandparent-aged is Lolo or Lola. Calling a 60-year-old man Kuya is a common foreigner mistake."],
  ["Clock times use Spanish numbers", "Say ala-una for 1:00, then alas-dos, alas-tres and so on. Half past is y medya: alas-sais y medya = 6:30."],
  ["Verbs show aspect, not tense", "A verb tells you if an action is done, ongoing or coming up: kumain (ate), kumakain (is eating), kakain (will eat). Copy the first syllable of the root for ongoing and future."],
  ["'Kumain ka na?' is a greeting", "It works like 'How are you?' and shows care. Refusing food can seem impolite, so accept at least a little."],
  ["Taglish is normal", "Filipinos mix English into Tagalog all the time: 'Ano work mo?', 'Walang ice', 'Yung bill po'. You don't have to avoid English words."]
];


function srcLink(k) { const s = SRC[k]; return s ? `<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>` : ""; }

function sourcesCard() {
  const used = Object.keys(SRC);
  return `<details class="card"><summary><b>Sources</b> <span class="small muted">· ${used.length} references</span></summary>
    <p class="small muted" style="margin-block:8px">Every flashcard and verb form was checked against one of these and names it on the card. Phrases I couldn't confirm were left out. The stories are original practice texts built from the checked phrases, so they don't come from a published source.</p>
    <ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">${used.map(k => `<li>${srcLink(k)}</li>`).join("")}</ul></details>`;
}
/* ================= STATE ================= */
const DAY = 864e5;
const today = () => new Date().toISOString().slice(0, 10);
const LS_KEY = "tarausap.v1";
const blank = () => ({ cards: {}, days: {}, streak: { last: null, count: 0 }, mine: [], storiesDone: [], dir: "es-en", goal: 30, newPerDay: 10, newToday: { d: null, n: 0 } });
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let progressDoc = null;   // db doc when signed in
let saveTimer = null, saving = false, saveAgain = false;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!progressDoc) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush() {
  if (!progressDoc) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await progressDoc.set({ state: JSON.stringify(S), at: Date.now() }); } catch (e) {}
  saving = false;
  if (saveAgain) { saveAgain = false; flush(); }
}
(async () => {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection("data/users/" + id).doc("progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    progressDoc = ref;
    if (remote && remote.state) {
      const r = JSON.parse(remote.state);
      if (countReviews(r) >= countReviews(S)) { S = Object.assign(blank(), r); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} render(); }
      else flush();
    } else if (countReviews(S) > 0) flush();
  } catch (e) {}
})();
function countReviews(s) { return Object.values(s.days || {}).reduce((a, b) => a + b, 0) + Object.keys(s.cards || {}).length; }

function addXP(n) {
  const d = today();
  S.days[d] = (S.days[d] || 0) + n;
  if (S.streak.last !== d) {
    const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  save(); updatePills();
}
function streakNow() {
  const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
  return (S.streak.last === today() || S.streak.last === y) ? S.streak.count : 0;
}
function updatePills() {
  $("#streakPill").textContent = "🔥 " + streakNow();
  $("#xpPill").textContent = (S.days[today()] || 0) + " pts";
}

/* ================= HELPERS ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿?¡!.,'’-]/g, "").replace(/\s+/g, " ").trim();

/* Native audio lives on other sites the page can't load audio from, so we link out to it. */
const EXT = 'target="_blank" rel="noopener"';
const ITALKI = "https://www.italki.com/en/teachers/filipino%28tagalog%29", PREPLY = "https://preply.com/en/online/tagalog-tutors";
function cleanTl(t) { return String(t).split(" / ")[0].replace(/[…!?¿¡.,«»—]/g, "").replace(/\s+/g, " ").trim(); }
function forvoUrl(w) { return "https://forvo.com/word/" + encodeURIComponent(w.toLowerCase()) + "/#tl"; }
function gtUrl(t) { return "https://translate.google.com/?sl=tl&tl=en&op=translate&text=" + encodeURIComponent(t); }
function hearLinks(text) {
  const t = cleanTl(text), single = !t.includes(" ");
  return `<span class="hear">Hear it: ${single ? `<a ${EXT} href="${forvoUrl(t)}">Forvo</a> · <a ${EXT} href="https://www.tagalog.com/dictionary/${encodeURIComponent(t.toLowerCase())}">Tagalog.com</a> · ` : ""}<a ${EXT} href="${gtUrl(t)}">Google Translate</a></span>`;
}
function formLinks(v) {
  return `<span class="hear">Hear each form on Forvo: ${[...new Set(VERBS[v].forms)].map(f => `<a ${EXT} href="${forvoUrl(f)}">${f}</a>`).join(" · ")}</span>`;
}
function hearCard() {
  return `<div class="card" style="display:grid;gap:8px"><h3>Hear real Filipino voices</h3>
    <p class="small">Every phrase has <b>Hear it</b> links. <b>Forvo</b> has recordings by native speakers, best for single words. <b>Tagalog.com</b> dictionary entries include audio. <b>Google Translate</b> reads whole phrases and stories with a voice built for Filipino; it's computer-generated but sounds natural. They open in your browser.</p>
    <p class="small">For real conversation, a Filipino tutor is the best teacher: <a ${EXT} href="${ITALKI}">italki</a> · <a ${EXT} href="${PREPLY}">Preply</a></p></div>`;
}
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function speakBtn(text) { return !voice ? "" : `<button class="speak" data-say="${esc(text)}" aria-label="Listen: ${esc(text)}">${SPK}</button>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

// Phones rarely ship a Filipino voice; Indonesian spells and sounds close enough to be a useful stand-in.
// Without a real Filipino voice, Tagalog is not read aloud unless the learner opts into the stand-in voice.
let voice = null, voiceNative = false, nearVoice = null, booted = false, tlStandIn = false;
try { tlStandIn = localStorage.getItem("tarausap.standin") === "on"; } catch (e) {}
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    const fil = vs.find(v => /^(fil|tl)\b/i.test(v.lang));
    nearVoice = vs.find(v => /^id\b/i.test(v.lang)) || vs.find(v => /^ms\b/i.test(v.lang)) || null;
    const had = voice;
    voice = fil || (tlStandIn ? nearVoice : null) || null; voiceNative = !!fil;
    if (had !== voice && booted) render();
  } catch (e) {}
}
function setStandIn(on) {
  tlStandIn = on;
  try { localStorage.setItem("tarausap.standin", on ? "on" : "off"); } catch (e) {}
  pickVoice(); render();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-standin]"); if (b) setStandIn(b.dataset.standin === "on"); });
function standInToggle() {
  if (voiceNative || !nearVoice) return "";
  return tlStandIn
    ? `<button class="chip" data-standin="off">Stop reading Tagalog with the stand-in voice</button>`
    : `<button class="chip" data-standin="on">Read Tagalog with a stand-in Indonesian voice anyway</button>`;
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function voiceNote() {
  if (voiceNative) return "";
  return `<div class="card" style="display:grid;gap:8px"><h3>Phone voice</h3><p class="small">${voice ? "Your phone has no Filipino voice, so Tagalog is read with a stand-in Indonesian voice. Pronunciation is only approximate." : "Your phone has no Filipino voice, so the app doesn't read Tagalog aloud. Use the Hear it links for native audio."} On Android, you can add a real Filipino voice in Settings → Text-to-speech → Google → Install voice data.</p>${standInToggle()}</div>`;
}
function say(text, rate = 0.9, onend) {
  if (!voice) { if (onend) onend(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[—«»…]/g, " "));
    u.lang = voice.lang; u.voice = voice; u.rate = rate;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); say(b.dataset.say); } });

function allDecks() {
  const d = DECKS.slice();
  if (S.mine.length) d.push({ id: "mine", name: "My words", es: "Mis palabras", cards: S.mine });
  return d;
}
function cardState(es) { return S.cards[es]; }
function isDue(es) { const c = S.cards[es]; return c && c.due <= Date.now(); }
function dueCount(deck) { return deck.cards.filter(c => isDue(c[0])).length; }
function learnedCount(deck) { return deck.cards.filter(c => S.cards[c[0]]).length; }
function totalDue() { return allDecks().reduce((a, d) => a + dueCount(d), 0); }
function newLeft() { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; return Math.max(0, S.newPerDay - S.newToday.n); }

function addMine(es, en) {
  if (S.mine.some(m => m[0] === es) || DECKS.some(d => d.cards.some(c => c[0] === es))) return false;
  S.mine.push([es, en]); save(); return true;
}

let tab = "home";
function go(t) {
  tab = t;
  try { speechSynthesis.cancel(); } catch (e) {}
  releaseMic();
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { sub = null; go(b.dataset.tab); }));
let sub = null; // per-tab sub-view
function render() {
  updatePills();
  const v = $("#view");
  const views = { home: viewHome, cards: viewCards, stories: viewStories, practice: viewPractice };
  v.innerHTML = "";
  const sec = document.createElement("section");
  v.appendChild(sec);
  views[tab](sec);
}

/* ================= FLASHCARDS ================= */
function viewCards(el) {
  if (sub && sub.type === "study") return viewStudy(el);
  if (sub && sub.type === "browse") return viewBrowse(el);
  const decks = allDecks();
  el.innerHTML = `
    <div class="row between"><h1>Salita</h1><button class="chip" id="dirBtn">${S.dir === "es-en" ? "TL → EN" : "EN → TL"}</button></div>
    <p class="muted">Spaced repetition: cards you know come back less often. ${newLeft()} new cards left today.</p>
    <button class="btn block" id="studyAll" ${totalDue() || newLeft() ? "" : "disabled"}>Study all due (${totalDue()})</button>
    <div class="grid2">${decks.map(d => {
      const l = learnedCount(d), du = dueCount(d);
      return `<button class="deck" data-deck="${d.id}"><span class="eyebrow">${esc(d.es)}</span><h3>${esc(d.name)}</h3>
        <span class="count">${l}/${d.cards.length} learned${du ? ` · <b style="color:var(--accent)">${du} due</b>` : ""}</span>
        <span class="bar"><i style="width:${l / d.cards.length * 100}%"></i></span></button>`;
    }).join("")}</div>
    <h2 style="margin-top:6px">Phrasebook</h2>
    <p class="muted small">Every phrase in the app, searchable, with audio.</p>
    <input type="text" id="pbSearch" placeholder="Search Spanish or English…" autocomplete="off">
    <div class="card" id="pbList" style="padding-block:4px"></div>`;
  $("#dirBtn", el).onclick = () => { S.dir = S.dir === "es-en" ? "en-es" : "es-en"; save(); render(); };
  $("#studyAll", el).onclick = () => { sub = { type: "study", deck: "all" }; render(); };
  el.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => { sub = { type: "browse", deck: b.dataset.deck }; render(); window.scrollTo(0, 0); });
  const listEl = $("#pbList", el);
  const drawPB = q => {
    const nq = norm(q || "");
    const rows = decks.flatMap(d => d.cards.map(c => ({ c, d }))).filter(({ c }) => !nq || norm(c[0]).includes(nq) || norm(c[1]).includes(nq));
    const shown = nq ? rows.slice(0, 60) : rows.filter(r => r.d.id === "survival");
    listEl.innerHTML = shown.length ? shown.map(({ c }) => `<div class="phrase"><div class="txt"><b>${esc(c[0])}</b><span>${esc(c[1])}</span>${c[3] ? `<span class="small" style="display:block">Source: ${srcLink(c[3])}</span>` : ""}${hearLinks(c[0])}</div>${speakBtn(c[0])}</div>`).join("") + (nq ? "" : `<p class="small muted" style="padding:10px 0">Showing survival basics. Search to find any phrase.</p>`)
      : `<p class="muted" style="padding:12px 0">No phrase matches “${esc(q)}”.</p>`;
  };
  $("#pbSearch", el).oninput = e => drawPB(e.target.value);
  drawPB("");
}

function viewBrowse(el) {
  const d = allDecks().find(x => x.id === sub.deck);
  if (!d) { sub = null; return viewCards(el); }
  el.innerHTML = `
    <button class="back" id="back">‹ All decks</button>

      const s = cardState(c[0]);
      const tag = !s ? "new" : s.iv >= 21 ? "strong" : s.iv >= 3 ? "learning" : "fresh";
      return `<div class="phrase"><div class="txt"><b>${esc(c[0])}</b><span>${esc(c[1])}${c[2] ? " · " + esc(c[2]) : ""}</span>${c[3] ? `<span class="small" style="display:block">Source: ${srcLink(c[3])}</span>` : ""}${hearLinks(c[0])}</div><span class="small muted">${tag}</span>${speakBtn(c[0])}</div>`;

  $("#back", el).onclick = () => { sub = null; render(); };
  $("#study", el).onclick = () => { sub = { type: "study", deck: d.id }; render(); };
  $("#quiz", el).onclick = () => { sub = { type: "quiz", deck: d.id }; go("practice"); };
}

function buildQueue(deckId) {
  const decks = deckId === "all" ? allDecks() : allDecks().filter(d => d.id === deckId);
  const cards = decks.flatMap(d => d.cards);
  const due = shuffle(cards.filter(c => isDue(c[0])));
  let fresh = cards.filter(c => !S.cards[c[0]]);
  if (deckId === "all") fresh = DECKS.flatMap(d => d.cards).filter(c => !S.cards[c[0]]).concat(S.mine.filter(c => !S.cards[c[0]]));
  fresh = fresh.slice(0, newLeft());
  return due.concat(fresh);
}
function schedule(es, grade) { // grade: 0 again, 1 hard, 2 good, 3 easy
  const isNew = !S.cards[es];
  const c = S.cards[es] || { iv: 0, ease: 2.5, reps: 0, due: 0 };
  if (isNew) { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; S.newToday.n++; }
  if (grade === 0) { c.iv = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = Date.now() + 60e3; }
  else {
    if (grade === 1) { c.iv = Math.max(1, Math.round(c.iv * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
    if (grade === 2) c.iv = c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease);
    if (grade === 3) { c.iv = c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3); c.ease += 0.15; }
    c.due = Date.now() + c.iv * DAY - 3600e3;
  }
  c.reps++;
  S.cards[es] = c;
}
function previewIv(es, g) {
  const c = S.cards[es] || { iv: 0, ease: 2.5 };
  if (g === 0) return "1 min";
  const iv = g === 1 ? Math.max(1, Math.round(c.iv * 1.2)) : g === 2 ? (c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease)) : (c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3));
  return iv < 30 ? iv + "d" : Math.round(iv / 30) + "mo";
}
function viewStudy(el) {

      <div class="row" style="justify-content:center"><button class="btn" id="more">Read a story</button><button class="btn ghost" id="quiz">Quick quiz</button></div></div>`;
    $("#back", el).onclick = () => { sub = null; render(); };
    $("#more", el).onclick = () => { sub = null; go("stories"); };
    $("#quiz", el).onclick = () => { sub = { type: "quiz", deck: "all" }; go("practice"); };
    return;
  }
  const c = q[0];
  const front = S.dir === "es-en" ? c[0] : c[1], back = S.dir === "es-en" ? c[1] : c[0];

}

/* ================= MAGSALITA (say it out loud before you see the answer) ================= */
// The answer stays hidden until the learner records themselves. Where the microphone is blocked
// (inside claude.ai), the learner says it aloud and taps instead.
let micStream = null, recorder = null, recTimer = null;
async function getMic() {
  if (micStream) return micStream;
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error("unsupported");
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  return micStream;
}
function releaseMic() {
  clearTimeout(recTimer);
  try { if (recorder && recorder.state === "recording") recorder.stop(); } catch (e) {}
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}
function speakPool() {
  // Short phrases the learner has started in their flashcards first, then the survival basics.
  const short = c => c[0].split(" ").length <= 6 && !c[0].includes("…") && !c[0].includes(" / ");
  const all = DECKS.flatMap(d => d.cards).filter(short);
  const seen = all.filter(c => S.cards[c[0]]);
  return seen.length >= 10 ? seen : seen.concat(DECKS[0].cards.filter(short).filter(c => !S.cards[c[0]]));
}
function viewSpeak(el) {
  if (!sub.items) { sub.items = shuffle(speakPool()).slice(0, 10); sub.i = 0; sub.right = 0; sub.state = "prompt"; sub.tries = 0; }
  const back = () => { releaseMic(); if (sub.url) URL.revokeObjectURL(sub.url); sub = null; render(); };
  if (sub.i >= sub.items.length) {
    releaseMic();
    el.innerHTML = `<div class="card empty"><span class="eyebrow">Magsalita</span><h2>${sub.right}/${sub.items.length}</h2>
      <p class="muted">${sub.right >= 8 ? "Ang galing! You said almost everything right." : "Keep going. Speaking from memory is the hardest skill, and every round makes it easier."}</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Another round</button><button class="btn ghost" id="b">Done</button></div></div>`;
    $("#again", el).onclick = () => { sub = { type: "speak" }; render(); };
    $("#b", el).onclick = back;
    return;
  }
  const c = sub.items[sub.i];
  const review = sub.state === "review";
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Practice</button><span class="small muted">${sub.i + 1} / ${sub.items.length} · ${sub.right} said right</span></div>
    <div class="card" style="display:grid;gap:10px;justify-items:center;text-align:center">
      <span class="eyebrow">Say it in Tagalog</span>
      <div class="prompt-big">${esc(c[1])}</div>
      ${review ? `<div class="sp-answer">${esc(c[0])}</div>${c[2] ? `<p class="small muted">${esc(c[2])}</p>` : ""}` : `<p class="small muted">${sub.tries ? "Try it once more, out loud." : "Say the whole phrase out loud before you look."}</p>`}
    </div>
    ${review ? `
      ${sub.url ? `<div class="card" style="display:grid;gap:8px"><span class="eyebrow">You said</span><audio controls src="${sub.url}" style="width:100%"></audio></div>` : ""}
      <div class="card" style="display:grid;gap:6px"><span class="eyebrow">Compare with a native speaker</span>${hearLinks(c[0])}</div>
      <div class="sp-rate"><button class="btn ghost" id="retry">Try again</button><button class="btn" id="ok">I said it right</button></div>
      <button class="sp-skip" id="skip">Not yet, next phrase</button>`
    : sub.noMic ? `
      <p class="small muted" style="text-align:center">${esc(sub.noMic)}</p>
      <button class="btn block" id="said">I said it out loud</button>`
    : `
      <button class="mic${sub.state === "recording" ? " on" : ""}" id="mic" aria-label="${sub.state === "recording" ? "Stop recording" : "Start recording"}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <p class="small muted" style="text-align:center">${sub.state === "recording" ? "Recording… tap again when you've finished" : "Tap the microphone and speak"}</p>`}`;
  $("#back", el).onclick = back;
  const reveal = () => { sub.state = "review"; render(); };
  const mic = $("#mic", el);
  if (mic) mic.onclick = async () => {
    if (sub.state === "recording") { clearTimeout(recTimer); recorder.stop(); return; }
    try {
      const stream = await getMic();
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        if (!sub || sub.type !== "speak") return; // left the screen mid-recording
        if (sub.url) URL.revokeObjectURL(sub.url);
        sub.url = chunks.length ? URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType || "audio/mp4" })) : null;
        reveal();
      };
      recorder.start();
      sub.state = "recording"; render();
      recTimer = setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, 10000);
    } catch (e) {
      sub.noMic = e && e.name === "NotAllowedError"
        ? "Microphone access was blocked. Allow it in Settings → Safari → Microphone (or for this app), or say the phrase out loud and tap below."
        : "The microphone isn't available here (inside claude.ai it's blocked). Say the phrase out loud, then tap below. In the installed app you can record yourself.";
      render();
    }
  };
  const said = $("#said", el); if (said) said.onclick = reveal;
  const next = ok => {
    if (ok) { sub.right++; addXP(3); }
    else if (S.cards[c[0]]) { S.cards[c[0]].due = Date.now(); save(); }
    if (sub.url) { URL.revokeObjectURL(sub.url); sub.url = null; }
    sub.i++; sub.state = "prompt"; sub.tries = 0; render(); window.scrollTo(0, 0);
  };
  const ok = $("#ok", el); if (ok) ok.onclick = () => next(true);
  const skip = $("#skip", el); if (skip) skip.onclick = () => next(false);
  const retry = $("#retry", el); if (retry) retry.onclick = () => { if (S.cards[c[0]]) { S.cards[c[0]].due = Date.now(); save(); } if (sub.url) { URL.revokeObjectURL(sub.url); sub.url = null; } sub.tries++; sub.state = "prompt"; render(); };
}

/* ================= SPEAKING STEP (built into every exercise) ================= */
// Each exercise asks the learner to say the Tagalog out loud before moving on. A step records them and
// plays it back beside native audio; where the microphone is blocked, they say it and tap instead.
// Steps are keyed so one screen can hold several (e.g. one per verb form). "main" is the single step most
// exercises use. The state lives on the current exercise (sub.gates) and is cleared whenever the item changes.
const speakOn = () => S.speakReq !== false;
const gateState = k => (sub && sub.gates && sub.gates[k]) || {};
const gateDone = k => !speakOn() || !!gateState(k).done;
const gateOpen = () => gateDone("main");
function resetGate() {
  if (sub && sub.gates) Object.values(sub.gates).forEach(g => { if (g.url) URL.revokeObjectURL(g.url); });
  if (sub) sub.gates = null;
  releaseMic();
}
const MIC_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const NO_MIC = { blocked: "Microphone access was blocked. Allow it in Settings → Safari → Microphone, or say it out loud and tap below.",
  missing: "The microphone isn't available here (inside claude.ai it's blocked). Say it out loud, then tap below." };
function gateHTML(label, text) {
  if (!speakOn()) return "";
  const g = gateState("main");
  if (g.done) return `<div class="card gate" style="display:grid;gap:8px">
      <span class="eyebrow">You said</span>
      ${g.url ? `<audio controls src="${g.url}" style="width:100%"></audio>` : `<span class="small muted">Said out loud ✓</span>`}
      ${text ? `<span class="small">Compare: ${hearLinks(text)}</span>` : ""}</div>`;
  return `<div class="card gate" style="display:grid;gap:10px;justify-items:center;text-align:center">
      <span class="eyebrow">Speak</span>
      <p><b>${esc(label)}</b></p>
      ${g.noMic ? `<p class="small muted">${esc(NO_MIC[g.noMic])}</p><button class="btn block" data-gsaid="main">I said it out loud</button>`
      : `<button class="mic${g.rec ? " on" : ""}" data-gmic="main" aria-label="${g.rec ? "Stop recording" : "Start recording"}">${MIC_SVG}</button>
         <p class="small muted">${g.rec ? "Recording… tap again when you've finished" : "Tap the microphone and say it"}</p>`}</div>`;
}
// A compact step for lists: one small microphone per item.
function miniGate(k, label, always) {
  if (!speakOn() && !always) return "";
  const g = gateState(k);
  if (g.done) return `<span class="mini-done">✓${g.url ? ` <button class="mini play" data-gplay="${esc(k)}" aria-label="Play what you said for ${esc(label)}">▶</button>` : ""}</span>`;
  if (g.noMic) return `<button class="mini said" data-gsaid="${esc(k)}">I said it</button>`;
  return `<button class="mini mic-s${g.rec ? " on" : ""}" data-gmic="${esc(k)}" aria-label="${g.rec ? "Stop recording" : "Say " + esc(label)}">${MIC_SVG}</button>`;
}
function wireGate(el, maxMs) {
  const gates = () => sub.gates || (sub.gates = {});
  const done = (k, url) => { if (!sub) return; gates()[k] = { done: true, url }; render(); };
  el.querySelectorAll("[data-gsaid]").forEach(b => b.onclick = () => done(b.dataset.gsaid, null));
  el.querySelectorAll("[data-gplay]").forEach(b => b.onclick = () => { const u = gateState(b.dataset.gplay).url; if (u) new Audio(u).play().catch(() => {}); });
  el.querySelectorAll("[data-gmic]").forEach(b => b.onclick = async () => {
    const k = b.dataset.gmic, g = gates()[k] || (gates()[k] = {});
    if (g.rec) { clearTimeout(recTimer); recorder.stop(); return; }
    // Only one recording at a time: finish any other one first.
    if (recorder && recorder.state === "recording") { clearTimeout(recTimer); recorder.stop(); }
    try {
      const stream = await getMic(), chunks = [], owner = sub;
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        if (sub !== owner || !sub.gates || !sub.gates[k] || !sub.gates[k].rec) return; // the exercise moved on mid-recording
        done(k, chunks.length ? URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType || "audio/mp4" })) : null);
      };
      recorder.start();
      g.rec = true; render();
      recTimer = setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, maxMs || 10000);
    } catch (e) {
      const why = e && e.name === "NotAllowedError" ? "blocked" : "missing";
      g.noMic = why;
      if (k !== "main") toast(why === "blocked" ? "Microphone blocked: say it out loud and tap “I said it”" : "No microphone here: say it out loud and tap “I said it”");
      render();
    }
  });
}
// Beside any Tagalog word: a microphone to say it and a Google Translate link to check it.
function wordTools(word) {
  return `<span class="tools">${miniGate(formKey(word), word, true)}<a class="g-link" ${EXT} href="${gtUrl(word)}" aria-label="Check ${esc(word)} on Google Translate">Google</a></span>`;
}
// "Say each form" list for a verb: every distinct form gets its own small microphone.
const formKey = f => "form:" + f;
function sayFormsHTML(forms, title) {
  if (!speakOn() || !forms.length) return "";
  const left = forms.filter(f => !gateDone(formKey(f))).length;
  return `<div class="card say-forms" style="display:grid;gap:4px">
    <div class="row between"><span class="eyebrow">${esc(title)}</span><span class="small ${left ? "muted" : ""}" style="${left ? "" : "color:var(--good);font-weight:700"}">${left ? `${left} to go` : "All said ✓"}</span></div>
    ${forms.map(f => `<div class="say-row"><span class="say-word">${esc(f)}</span>${wordTools(f)}</div>`).join("")}
    ${left ? `<p class="small muted">Tap each microphone and say the form out loud.</p>` : ""}</div>`;
}
function speakToggleHTML() {
  return `<div class="card row between"><span><b>Speaking required</b><br><span class="small muted">Say each answer out loud before you can move on</span></span>
    <button class="chip" id="speakReq" aria-pressed="${speakOn()}">${speakOn() ? "On" : "Off"}</button></div>`;
}
function wireSpeakToggle(el) { const b = $("#speakReq", el); if (b) b.onclick = () => { S.speakReq = !speakOn(); save(); render(); }; }

/* ================= ROOT BUILDER ================= */
// Each form split into parts: [affix], {copied syllable}, (sound change). Checked against VERBS on load.
const ROUTES = {
  kumain:     ["k[um]ain", "k[um]ain", "k[um]{a}kain", "{ka}kain"],
  uminom:     ["[um]inom", "[um]inom", "[um]{i}inom", "{i}inom"],
  umalis:     ["[um]alis", "[um]alis", "[um]{a}alis", "{a}alis"],
  pumunta:    ["p[um]unta", "p[um]unta", "p[um]{u}punta", "{pu}punta"],
  bumili:     ["b[um]ili", "b[um]ili", "b[um]{i}bili", "{bi}bili"],
  sumakay:    ["s[um]akay", "s[um]akay", "s[um]{a}sakay", "{sa}sakay"],
  dumating:   ["d[um]ating", "d[um]ating", "d[um]{a}(r)ating", "{da}(r)ating"],
  magtrabaho: ["[mag]trabaho", "[nag]trabaho", "[nag]{ta}trabaho", "[mag]{ta}trabaho"],
  magluto:    ["[mag]luto", "[nag]luto", "[nag]{lu}luto", "[mag]{lu}luto"],
  maligo:     ["[ma]ligo", "[na]ligo", "[na]{li}ligo", "[ma]{li}ligo"],
  kainin:     ["kain[in]", "k[in]ain", "k[in]{a}kain", "{ka}kain[in]"],
  inumin:     ["inum[in]", "[in]inom", "[in]{i}inom", "{i}inum[in]"]
};
Object.entries(ROUTES).forEach(([v, fs]) => fs.forEach((f, i) => { if (f.replace(/[[\]{}()]/g, "") !== VERBS[v].forms[i]) console.error("Route doesn't match verb form:", v, f); }));
const ROUTE_HOW = {
  "-um-": "Put -um- after the root's first consonant: k + um + ain = kumain. For ongoing, copy the first syllable and put -um- inside it: kumakain. For future, just copy the first syllable: kakain. The infinitive and the completed form are spelled the same (kumain = \"to eat\" or \"ate\"); context tells you which.",
  "um-vowel": "When the root starts with a vowel, um- goes in front: umalis. Ongoing and future copy only that first vowel: umaalis, aalis. As with all -um- verbs, the infinitive and the completed form are spelled the same: umalis = \"to leave\" or \"left\".",
  "mag-": "mag- for the infinitive and the future, nag- for done and ongoing. Ongoing and future also copy the root's first syllable: nagtatrabaho, magtatrabaho.",
  "ma-": "ma- for the infinitive and the future, na- for done and ongoing. Ongoing and future copy the root's first syllable: naliligo, maliligo.",
  "-in": "-in goes at the end for the infinitive: kainin. Done and ongoing put -in- inside instead: kinain, kinakain. The future copies the first syllable and keeps -in at the end: kakainin."
};
function routeHow(v) { const d = VERBS[v]; return ROUTE_HOW[d.group === "-um-" && /^[aeiou]/.test(d.root) ? "um-vowel" : d.group]; }
function routeHTML(str) {
  const out = [];
  str.replace(/\[([^\]]+)\]|\{([^}]+)\}|\(([^)]+)\)|([^[{(]+)/g, (m, a, c, r, t) => { out.push(a ? ["affix", a] : c ? ["copy", c] : r ? ["change", r] : ["root", t]); return m; });
  return out.map(([k, t]) => `<span class="rp-${k}">${esc(t)}</span>`).join("");
}
const ROUTE_LEGEND = `<p class="small muted route-legend"><span class="rp-affix">affix</span> · <span class="rp-copy">copied syllable</span> · <span class="rp-change">sound change</span> · plain = the root</p>`;
function newRoundFor(v) {
  const forms = VERBS[v].forms, root = VERBS[v].root;
  // Distractors: forms of the other verb built on the same root (kumain vs. kinain), which test the affix, not the root.
  const extra = [...new Set(Object.keys(VERBS).filter(o => o !== v && VERBS[o].root === root).flatMap(o => VERBS[o].forms))].filter(f => !forms.includes(f)).slice(0, 3);
  return { v, slots: [null, null, null, null], active: 0, done: false, wrong: null, pool: shuffle([...forms, ...extra].map((t, i) => ({ t, id: i, used: false }))) };
}
function viewRoots(el) {
  const names = Object.keys(VERBS);
  if (!sub.round) sub.round = newRoundFor(sub.v || names[Math.floor(Math.random() * names.length)]);
  if (!sub.mode) sub.mode = "match";
  const R = sub.round, v = R.v, d = VERBS[v];
  const route = `
    <div class="card route" style="display:grid;gap:12px">
      ${ASPECTS.map((a, i) => `<div class="route-step"><span class="eyebrow">${a}</span>
        <div class="word-line"><div class="route-form">${routeHTML(ROUTES[v][i])}</div>${wordTools(d.forms[i])}</div><span class="small muted">“${esc(d.en[i])}”</span></div>`).join("")}
      ${ROUTE_LEGEND}
      <p class="small">${esc(routeHow(v))}${d.note ? " " + esc(d.note) : ""}</p>
      ${formLinks(v)}
      <p class="small muted">Source: ${srcLink(d.src)}</p>
    </div>`;
  let body;
  const allForms = [...new Set(d.forms)];
  const formsSaid = allForms.every(f => gateDone(formKey(f)));
  if (sub.mode === "route") body = route + (speakOn() && !formsSaid ? `<p class="small muted">Say each form out loud with its microphone to unlock Next verb.</p>` : "");
  else {
    body = `
      <p class="small muted">Tap a row, then tap the form that fits it.</p>
      <div class="slots">${ASPECTS.map((a, i) => {
        const f = R.slots[i];
        return `<button class="slot${f ? " filled" : ""}${!f && R.active === i ? " active" : ""}" data-slot="${i}" ${f ? "disabled" : ""}>
          <span class="slot-label"><span class="eyebrow">${a}</span><span class="small">“${esc(d.en[i])}”</span></span>
          <span class="slot-form">${f ? routeHTML(ROUTES[v][i]) : "?"}</span></button>`;
      }).join("")}</div>
      ${R.done ? "" : `<div class="pool">${R.pool.map(c => `<button class="chip pool-chip${R.wrong === c.id ? " wrong" : ""}" data-chip="${c.id}" ${c.used ? "hidden" : ""}>${esc(c.t)}</button>`).join("")}</div>`}
      ${R.wrong !== null ? `<div class="feedback no">Not that one for “${esc(d.en[R.active])}”. Look at the affix and try again.</div>` : ""}
      ${R.done ? `<div class="feedback ok">Tama! Here's how each form is built from <b>${esc(d.root)}</b>.</div>${route}` : ""}
      ${sayFormsHTML([...new Set(R.slots.filter(Boolean))], "Say each form as you place it")}`;
  }
  el.innerHTML = `
    <button class="back" id="back">‹ Practice</button>
    <div><span class="eyebrow">Ugat · roots</span><h1>Root builder</h1></div>
    <div class="chips">${names.map(n => `<button class="chip" data-verb="${n}" aria-pressed="${n === v}">${esc(VERBS[n].root)}</button>`).join("")}</div>
    <div class="card root-card"><span class="eyebrow">Root</span><div class="root-word">${esc(d.root)}</div>
      <span class="muted">${esc(d.en[0].replace(/^to /, ""))} · makes <b>${v}</b>, a ${d.group} verb</span></div>
    <div class="chips"><button class="chip" data-mode="match" aria-pressed="${sub.mode === "match"}">Match the forms</button><button class="chip" data-mode="route" aria-pressed="${sub.mode === "route"}">See the route</button></div>
    ${body}
    <button class="btn block ${R.done || sub.mode === "route" ? "" : "ghost"}" id="nextVerb" ${(sub.mode === "route" || R.done) && !formsSaid ? "disabled" : ""}>Next verb</button>`;
  wireGate(el, 20000);
  $("#back", el).onclick = () => { resetGate(); sub = null; render(); };
  el.querySelectorAll("[data-verb]").forEach(b => b.onclick = () => { resetGate(); sub.round = newRoundFor(b.dataset.verb); render(); });
  el.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { sub.mode = b.dataset.mode; render(); });
  $("#nextVerb", el).onclick = () => { resetGate(); const others = names.filter(n => n !== v); sub.round = newRoundFor(others[Math.floor(Math.random() * others.length)]); sub.mode = "match"; render(); window.scrollTo(0, 0); };
  el.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { R.active = +b.dataset.slot; R.wrong = null; render(); });
  el.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => {
    const c = R.pool.find(x => x.id === +b.dataset.chip);
    if (c.t !== d.forms[R.active]) { R.wrong = c.id; render(); return; }
    c.used = true; R.slots[R.active] = c.t; R.wrong = null; addXP(1);
    const next = R.slots.findIndex(x => !x);
    if (next === -1) { R.done = true; addXP(3); } else R.active = next;
    render();
  });
}

/* boot */
go("home");
booted = true;
</script>

<script>
// Offline support: cache the app so it opens without a connection after the first visit.
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
