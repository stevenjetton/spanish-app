<style>

:root {
  --bg: #f2f6f4;

  --surface-2: #e3ede9;
  --fg: #13241f;
  --muted: #55675f;
  --line: #d0ded9;
  --accent: #0e6e6a;      /* capiz-shell teal */
  --accent-ink: #ffffff;
  --accent-soft: #d3eeea;
  --sun: #f4a81d;         /* carabao mango */
  --sun-soft: #fdf0cf;
  --good: #1f8a5b;
  --good-soft: #d8f1e5;
  --bad: #c0392b;
  --bad-soft: #f9dcd8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1614; --surface: #14211f; --surface-2: #1d2f2b; --fg: #e5f0ec; --muted: #91a8a1; --line: #29403b;
    --accent: #5cc9bf; --accent-ink: #07201c; --accent-soft: #18403b; --sun: #f5c04a; --sun-soft: #3a3020;
    --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1614; --surface: #14211f; --surface-2: #1d2f2b; --fg: #e5f0ec; --muted: #91a8a1; --line: #29403b;
  --accent: #5cc9bf; --accent-ink: #07201c; --accent-soft: #18403b; --sun: #f5c04a; --sun-soft: #3a3020;
  --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.tile { width: 26px; height: 26px; border-radius: 6px; background: repeating-linear-gradient(45deg, var(--accent) 0 5px, transparent 5px 10px), repeating-linear-gradient(-45deg, var(--sun) 0 5px, var(--accent-soft) 5px 10px); }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.sun { background: var(--sun-soft); border-color: transparent; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main section { display: grid; gap: 16px; padding-block: 6px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.sun { background: var(--sun); color: #2a1d00; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.9rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.speak { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.speak svg { width: 20px; height: 20px; fill: currentColor; }

/* home */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 20px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; opacity: 0.18;
  background: radial-gradient(circle, var(--accent-ink) 0 14%, transparent 15%) 0 0 / 35px 35px; }
.hero .big { font-family: var(--font-display); font-size: 1.55rem; font-weight: 800; line-height: 1.15; }
.meter { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent-ink) 25%, transparent); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .4s; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 0.75rem; color: var(--muted); }
.week i { display: block; height: 34px; border-radius: 8px; background: var(--surface-2); margin-bottom: 4px; position: relative; overflow: hidden; }
.week i > s { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); text-decoration: none; }
.week .today { color: var(--fg); font-weight: 700; }
.pod { display: grid; gap: 6px; }
.pod .es { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.action { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.action b { font-family: var(--font-display); font-size: 1.05rem; }

/* flashcard */
.deck { text-align: left; display: grid; gap: 6px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.deck .count { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck .bar { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.deck .bar i { display: block; height: 100%; background: var(--good); }
.flash { perspective: 1200px; min-height: 280px; }
.flash .inner { position: relative; min-height: 280px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; }
.face.rear { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
.face .term { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.face .note { font-size: 0.92rem; color: var(--muted); max-width: 34ch; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { border: 0; border-radius: 12px; padding: 10px 4px; font-weight: 700; display: grid; gap: 1px; background: var(--surface-2); }
.rate button small { font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.rate .again { background: var(--bad-soft); }
.rate .good { background: var(--good-soft); }
@media (prefers-reduced-motion: reduce) { .flash .inner, .meter > i { transition: none; } }

/* stories */
.story-list { display: grid; gap: 10px; }
.story-item { text-align: left; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.lvl { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--sun-soft); }
.done-tag { font-size: 0.75rem; font-weight: 700; color: var(--good); }
.sent { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; font-size: 1.12rem; line-height: 1.55; }
.sent:hover { background: var(--surface-2); }
.sent .en { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 4px; font-style: italic; }
.sent.speaking { background: var(--sun-soft); }
.gloss { display: grid; gap: 6px; }
.gloss-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gloss-row:last-child { border-bottom: 0; }
.gloss-row .w { font-weight: 700; flex: 1; min-width: 0; }
.add { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 0.82rem; font-weight: 700; }
.add[disabled] { color: var(--good); border-color: transparent; background: var(--good-soft); }

.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 1.02rem; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.prompt-big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
input[type="text"], textarea, select { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.conj { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.conj td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--muted); width: 45%; }
.accents { display: flex; gap: 6px; flex-wrap: wrap; }
.accents button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 38px; padding: 6px 8px; font-weight: 700; }

/* phrasebook */
.phrase { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.phrase:last-child { border-bottom: 0; }
.phrase .txt { flex: 1; min-width: 0; }
.phrase .txt b { display: block; font-size: 1.05rem; }
.phrase .txt span { color: var(--muted); font-size: 0.92rem; }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; display: grid; gap: 6px; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.msg .tr { font-size: 0.88rem; color: var(--muted); font-style: italic; }
.msg .fix { font-size: 0.88rem; background: var(--sun-soft); border-radius: 8px; padding: 6px 8px; }
.composer { display: flex; gap: 8px; }
.hear { display: block; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.hear a { font-weight: 700; }
.seg-t { font-weight: 700; color: var(--accent); }
.seg.now { background: var(--sun-soft); border-radius: 4px; box-shadow: 0 0 0 2px var(--sun-soft); }
details summary { cursor: pointer; }
.composer input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; justify-self: start; }
.tip { background: var(--sun-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
</style>

    const ref = db.collection("data/users/" + id).doc("progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    progressDoc = ref;
    if (remote && remote.state) {
      const r = JSON.parse(remote.state);
      if (countReviews(r) >= countReviews(S)) { S = Object.assign(blank(), r); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} render(); }
      else flush();
    } else if (countReviews(S) > 0) flush();
  } catch (e) {}
})();
function countReviews(s) { return Object.values(s.days || {}).reduce((a, b) => a + b, 0) + Object.keys(s.cards || {}).length; }

function addXP(n) {
  const d = today();
  S.days[d] = (S.days[d] || 0) + n;
  if (S.streak.last !== d) {
    const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  save(); updatePills();
}
function streakNow() {
  const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
  return (S.streak.last === today() || S.streak.last === y) ? S.streak.count : 0;
}
function updatePills() {
  $("#streakPill").textContent = "🔥 " + streakNow();
  $("#xpPill").textContent = (S.days[today()] || 0) + " pts";
}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿?¡!.,'’-]/g, "").replace(/\s+/g, " ").trim();

/* Native audio lives on other sites the page can't load audio from, so we link out to it. */

function gtUrl(t) { return "https://translate.google.com/?sl=tl&tl=en&op=translate&text=" + encodeURIComponent(t); }

// Phones rarely ship a Filipino voice; Indonesian spells and sounds close enough to be a useful stand-in.
// Without a real Filipino voice, Tagalog is not read aloud unless the learner opts into the stand-in voice.
let voice = null, voiceNative = false, nearVoice = null, booted = false, tlStandIn = false;
try { tlStandIn = localStorage.getItem("tarausap.standin") === "on"; } catch (e) {}
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    const fil = vs.find(v => /^(fil|tl)\b/i.test(v.lang));
    nearVoice = vs.find(v => /^id\b/i.test(v.lang)) || vs.find(v => /^ms\b/i.test(v.lang)) || null;
    const had = voice;
    voice = fil || (tlStandIn ? nearVoice : null) || null; voiceNative = !!fil;
    if (had !== voice && booted) render();
  } catch (e) {}
}
function setStandIn(on) {
  tlStandIn = on;
  try { localStorage.setItem("tarausap.standin", on ? "on" : "off"); } catch (e) {}

}
document.addEventListener("click", e => { const b = e.target.closest("[data-standin]"); if (b) setStandIn(b.dataset.standin === "on"); });
function standInToggle() {
  if (voiceNative || !nearVoice) return "";
  return tlStandIn
    ? `<button class="chip" data-standin="off">Stop reading Tagalog with the stand-in voice</button>`
    : `<button class="chip" data-standin="on">Read Tagalog with a stand-in Indonesian voice anyway</button>`;
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function voiceNote() {
  if (voiceNative) return "";
  return `<div class="card" style="display:grid;gap:8px"><h3>Phone voice</h3><p class="small">${voice ? "Your phone has no Filipino voice, so Tagalog is read with a stand-in Indonesian voice. Pronunciation is only approximate." : "Your phone has no Filipino voice, so the app doesn't read Tagalog aloud. Use the Hear it links for native audio."} On Android, you can add a real Filipino voice in Settings → Text-to-speech → Google → Install voice data.</p>${standInToggle()}</div>`;
}
function say(text, rate = 0.9, onend) {
  if (!voice) { if (onend) onend(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[—«»…]/g, " "));
    u.lang = voice.lang; u.voice = voice; u.rate = rate;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  } catch (e) {}
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); say(b.dataset.say); } });

function allDecks() {
  const d = DECKS.slice();
  if (S.mine.length) d.push({ id: "mine", name: "My words", es: "Mis palabras", cards: S.mine });
  return d;
}
function cardState(es) { return S.cards[es]; }
function isDue(es) { const c = S.cards[es]; return c && c.due <= Date.now(); }
function dueCount(deck) { return deck.cards.filter(c => isDue(c[0])).length; }
function learnedCount(deck) { return deck.cards.filter(c => S.cards[c[0]]).length; }
function totalDue() { return allDecks().reduce((a, d) => a + dueCount(d), 0); }
function newLeft() { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; return Math.max(0, S.newPerDay - S.newToday.n); }

function addMine(es, en) {
  if (S.mine.some(m => m[0] === es) || DECKS.some(d => d.cards.some(c => c[0] === es))) return false;
  S.mine.push([es, en]); save(); return true;
}

function buildQueue(deckId) {
  const decks = deckId === "all" ? allDecks() : allDecks().filter(d => d.id === deckId);
  const cards = decks.flatMap(d => d.cards);
  const due = shuffle(cards.filter(c => isDue(c[0])));
  let fresh = cards.filter(c => !S.cards[c[0]]);
  if (deckId === "all") fresh = DECKS.flatMap(d => d.cards).filter(c => !S.cards[c[0]]).concat(S.mine.filter(c => !S.cards[c[0]]));
  fresh = fresh.slice(0, newLeft());
  return due.concat(fresh);
}
function schedule(es, grade) { // grade: 0 again, 1 hard, 2 good, 3 easy
  const isNew = !S.cards[es];
  const c = S.cards[es] || { iv: 0, ease: 2.5, reps: 0, due: 0 };
  if (isNew) { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; S.newToday.n++; }
  if (grade === 0) { c.iv = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = Date.now() + 60e3; }
  else {
    if (grade === 1) { c.iv = Math.max(1, Math.round(c.iv * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
    if (grade === 2) c.iv = c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease);
    if (grade === 3) { c.iv = c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3); c.ease += 0.15; }
    c.due = Date.now() + c.iv * DAY - 3600e3;
  }
  c.reps++;
  S.cards[es] = c;
}
function previewIv(es, g) {
  const c = S.cards[es] || { iv: 0, ease: 2.5 };
  if (g === 0) return "1 min";
  const iv = g === 1 ? Math.max(1, Math.round(c.iv * 1.2)) : g === 2 ? (c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease)) : (c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3));
  return iv < 30 ? iv + "d" : Math.round(iv / 30) + "mo";
}
function viewStudy(el) {
  if (!sub.queue) { sub.queue = buildQueue(sub.deck); sub.done = 0; }
  const q = sub.queue;
  if (!q.length) {
    el.innerHTML = `<button class="back" id="back">‹ Decks</button>

  }
  const c = q[0];
  const front = S.dir === "es-en" ? c[0] : c[1], back = S.dir === "es-en" ? c[1] : c[0];
  const isNew = !S.cards[c[0]];
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Stop</button><span class="small muted">${q.length} left${isNew ? " · new card" : ""}</span></div>
    <div class="flash" id="flash" role="button" tabindex="0" aria-label="Tap to flip">
      <div class="inner">
        <div class="face"><span class="eyebrow">${S.dir === "es-en" ? "Tagalog" : "English"}</span><div class="term">${esc(front)}</div>
          ${S.dir === "es-en" ? speakBtn(c[0]) : ""}<span class="small muted">Tap to flip</span></div>
        <div class="face rear"><span class="eyebrow">${S.dir === "es-en" ? "English" : "Tagalog"}</span><div class="term">${esc(back)}</div>
          ${speakBtn(c[0])}${c[2] ? `<div class="note">${esc(c[2])}</div>` : ""}${c[3] ? `<div class="note small">Source: ${srcLink(c[3])}</div>` : ""}<div class="note small">${hearLinks(c[0])}</div></div>
      </div>
    </div>
    <div class="rate" id="rate" hidden>
      ${["Again", "Hard", "Good", "Easy"].map((l, i) => `<button class="${["again", "", "good", ""][i]}" data-g="${i}">${l}<small>${previewIv(c[0], i)}</small></button>`).join("")}
    </div>
    <button class="btn block ghost" id="showBtn">Show answer</button>`;
  const flip = () => {
    $("#flash", el).classList.add("flipped"); $("#rate", el).hidden = false; $("#showBtn", el).hidden = true;
    if (S.dir === "en-es") say(c[0]);

  $("#flash", el).onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };

  el.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const g = +b.dataset.g;
    schedule(c[0], g); q.shift(); sub.done++;
    if (g === 0) q.splice(Math.min(q.length, 3), 0, c);
    addXP(1); render();
  });
}

function quizPool(deckId) {

  if (learned.length >= 10 && deckId === "all") pool = learned;
  return pool;
}
function viewQuiz(el, listen) {

      const rev = !listen && Math.random() < 0.5;
      const distract = shuffle(all.filter(x => x[0] !== c[0])).slice(0, 3);

/* ================= VERB COACH (AI teacher, spoken) ================= */
let vpref = {};
try { vpref = JSON.parse(localStorage.getItem(COACH.key + ".voices") || "{}"); } catch (e) {}
function saveVpref() { try { localStorage.setItem(COACH.key + ".voices", JSON.stringify(vpref)); } catch (e) {} }
function allVoices() { try { return speechSynthesis.getVoices(); } catch (e) { return []; } }
// Phones ship several voices per language; the "Enhanced"/"Premium"/neural ones sound far more human.
function voiceScore(v) {
  let s = 0;
  if (/enhanced|premium|natural|neural/i.test(v.name)) s += 4;
  if (/google|siri/i.test(v.name)) s += 2;
  if (v.localService === false) s += 1;
  return s + (COACH.voiceBonus ? COACH.voiceBonus(v) : 0);
}
function voicesFor(kind) { return allVoices().filter(v => kind === "en" ? /^en/i.test(v.lang || "") : COACH.voiceTest(v.lang || "")); }
function coachVoice(kind) {
  if (kind !== "en" && !voice) return null;
  const vs = voicesFor(kind), pref = kind === "en" ? vpref.en : vpref.target;
  return vs.find(v => v.name === pref) || vs.sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
}
let coachRun = 0;
function stopSpeaking() { coachRun++; try { speechSynthesis.cancel(); } catch (e) {} }
function speakSegments(segs, onSeg, onDone) {
  const run = ++coachRun;
  try { speechSynthesis.cancel(); } catch (e) {}
  let i = 0;
  const next = () => {
    if (run !== coachRun) return;
    if (i >= segs.length) { onSeg(-1); if (onDone) onDone(); return; }
    const sg = segs[i], en = sg.lang === "en", v = coachVoice(en ? "en" : "target");
    onSeg(i);
    if (!v) { i++; next(); return; }
    try {
      const u = new SpeechSynthesisUtterance(String(sg.text).replace(/[—«»…*_#]/g, " "));
      u.voice = v; u.lang = v.lang; u.rate = (vpref.rate || 1) * (en ? 0.98 : 0.85);
      u.onend = () => { i++; setTimeout(next, en ? 120 : 320); };
      u.onerror = () => { i++; next(); };
      speechSynthesis.speak(u);
    } catch (e) { i++; next(); }
  };
  next();
}

const coach = { topic: null, log: [], busy: false, err: null, draft: "" };
function coachHear(segs) {
  const tl = [...new Set(segs.filter(s => s.lang !== "en").map(s => cleanTl(s.text)).filter(Boolean))];
  return tl.length ? `<span class="hear">Hear the Tagalog: ${tl.map(t => `<a ${EXT} href="${t.includes(" ") ? gtUrl(t) : forvoUrl(t)}">${esc(t)}</a>`).join(" · ")}</span>` : "";
}
function segHTML(segs, mi) {
  return segs.map((s, i) => {
    if (s.lang === "en") return `<span class="seg" data-m="${mi}" data-seg="${i}">${esc(s.text)}</span>`;
    const t = cleanTl(s.text);
    return `<a class="seg seg-t" ${EXT} href="${t.includes(" ") ? gtUrl(t) : forvoUrl(t)}" data-m="${mi}" data-seg="${i}">${esc(s.text)}</a>`;
  }).join(" ");
}
function playCoach(mi) {
  const m = coach.log[mi]; if (!m || m.role !== "coach") return;
  speakSegments(m.segs, i => {
    document.querySelectorAll(".seg.now").forEach(x => x.classList.remove("now"));
    const sp = document.querySelector(`.seg[data-m="${mi}"][data-seg="${i}"]`); if (sp) sp.classList.add("now");
  });
}
async function coachTurn(userText) {
  coach.busy = true; coach.err = null; render();
  const sample = await getSample();
  if (!sample) { coach.busy = false; coach.err = "The coach needs the Claude app or claude.ai, signed in."; render(); return; }
  const transcript = coach.log.map(m => m.role === "coach" ? "Teacher: " + m.segs.map(s => s.text).join(" ") : "Learner: " + m.text).join("\n");
  const prompt = `You are a warm, expert ${COACH.langName} teacher giving a spoken lesson to an English speaker, entirely about verb patterns.
Lesson topic: ${coach.topic[0]}. ${coach.topic[1]}
Learner level: ${S.level || "A1 beginner"}.
This lesson is VOICE-FIRST: every word is read aloud by text-to-speech. Talk the way a teacher talks: short, friendly sentences; no lists, tables, symbols, slashes or markdown.
Teach one small step per turn: name the pattern, give one or two examples, and always give the English meaning of each example. Then ask the learner ONE quick question to answer out loud (for example, "How would you say 'we eat'?").
When the learner answers, say clearly whether it is right, give the correct form, explain the pattern behind it in one sentence, then move to the next step. Reuse the pattern on new verbs so the learner feels it working. If the learner says they don't know, teach it again more simply.
${COACH.rules}
${voice ? "" : "The learner's phone cannot pronounce Tagalog, so Tagalog segments are SHOWN on screen, not spoken, and the learner taps them to hear a native speaker. In English segments, refer to them naturally (for example: \"the word on your screen means is eating\"). Never respell Tagalog words in English letters.\n"}Reference forms. ${COACH.strict}
${COACH.reference()}
Return ONLY JSON: {"segments":[{"lang":"en","text":"..."},{"lang":"${COACH.code}","text":"..."}]}
Put every ${COACH.langName} word or phrase in its own "${COACH.code}" segment so a native ${COACH.langName} voice says it; English goes in "en" segments. Keep the whole turn under 70 words.

Conversation so far:
${transcript || "(none)"}
Learner: ${userText}`;
  try {
    const r = await sample.json(prompt, { cache: false });
    const segs = (r && Array.isArray(r.segments) ? r.segments : []).filter(s => s && s.text).map(s => ({ lang: s.lang === "en" ? "en" : COACH.code, text: String(s.text) }));
    if (!segs.length) throw new Error("empty");
    coach.log.push({ role: "coach", segs });
    addXP(3);
    coach.busy = false;
    if (sub && sub.type === "coach") { render(); window.scrollTo(0, document.body.scrollHeight); playCoach(coach.log.length - 1); }
    return;
  } catch (err) {
    if (userText !== "(Start the lesson.)") { coach.log.pop(); coach.draft = userText; }
    coach.err = err && err.code === "not_granted" ? "The coach wasn't allowed. You can turn it on from this page's permissions." : err && err.code === "rate_limited" ? "Too many requests at once. Wait a minute and try again." : "Couldn't reach the coach. Check your connection and try again.";
  }
  coach.busy = false;
  if (sub && sub.type === "coach") render();
}
function voiceOptions(kind) {
  const vs = voicesFor(kind).sort((a, b) => voiceScore(b) - voiceScore(a)), cur = coachVoice(kind);
  if (!vs.length) return `<option>None on this device</option>`;
  return vs.map(v => `<option value="${esc(v.name)}" ${cur && cur.name === v.name ? "selected" : ""}>${esc(v.name)} (${esc(v.lang)})${/enhanced|premium|natural|neural/i.test(v.name) ? " ★" : ""}</option>`).join("");
}
function viewCoach(el) {
  const back = () => { stopSpeaking(); sub = null; render(); };
  if (!coach.topic) {
    const tv = coachVoice("target");
    el.innerHTML = `
      <button class="back" id="back">‹ Practice</button>
      <div><span class="eyebrow">AI mode</span><h1>Verb coach</h1></div>
      <p class="muted">An AI teacher explains verb patterns out loud, step by step, with meanings. Tagalog words are highlighted: tap one to hear a native speaker. Then it asks you a question. Answer by typing, or tap the microphone on your phone's keyboard and say it.</p>
      <div class="story-list">${COACH.topics.map((t, i) => `<button class="story-item" data-topic="${i}"><span class="lvl">${i + 1}</span><span><h3>${esc(t[0])}</h3><span class="small muted">${esc(t[1])}</span></span><span class="small muted">›</span></button>`).join("")}</div>
      <div class="card" style="display:grid;gap:10px">
        <h3>Voices</h3>
        <label class="small" for="vTarget">${COACH.langName} voice</label><select id="vTarget">${voiceOptions("target")}</select>
        <label class="small" for="vEn">English voice</label><select id="vEn">${voiceOptions("en")}</select>
        <label class="small" for="vRate">Speed</label>
        <select id="vRate">${[[0.8, "Slow"], [1, "Normal"], [1.15, "Fast"]].map(([r, l]) => `<option value="${r}" ${(vpref.rate || 1) === r ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="btn ghost" id="vTest">▶ Test voices</button>
        <p class="small muted">★ marks the most natural-sounding voices. ${COACH.voiceHelp}${tv ? "" : " " + COACH.noVoice}</p>${standInToggle()}
      </div>
      <div class="tip"><span class="eyebrow">Want a full voice conversation?</span>
        <span>In the Claude app, tap the voice button, then say or paste this. Claude listens and answers out loud with a natural voice.</span>
        <span class="small" id="cPrompt" style="font-style:italic">${esc(COACH.claudePrompt)}</span>
        <button class="btn ghost" id="cCopy">Copy prompt</button></div>`;
    $("#back", el).onclick = back;
    el.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => { coach.topic = COACH.topics[+b.dataset.topic]; coach.log = []; coach.err = null; coachTurn("(Start the lesson.)"); });
    $("#vTarget", el).onchange = e => { vpref.target = e.target.value; saveVpref(); };
    $("#vEn", el).onchange = e => { vpref.en = e.target.value; saveVpref(); };
    $("#vRate", el).onchange = e => { vpref.rate = +e.target.value; saveVpref(); };
    $("#vTest", el).onclick = () => speakSegments([{ lang: "en", text: COACH.testEn }, { lang: COACH.code, text: COACH.testTarget }], () => {});
    $("#cCopy", el).onclick = () => {
      const done = () => toast("Prompt copied");
      try { navigator.clipboard.writeText(COACH.claudePrompt).then(done, () => selectPrompt()); } catch (e) { selectPrompt(); }
    };
    const selectPrompt = () => { const r = document.createRange(); r.selectNodeContents($("#cPrompt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Tap Copy."); };
    return;
  }
  const last = coach.log.length - 1;
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Topics</button><span class="small muted">AI-generated lesson</span></div>
    <div><span class="eyebrow">Verb coach · ${esc(S.level || "A1 beginner")}</span><h2>${esc(coach.topic[0])}</h2></div>
    <p class="small muted">${voice ? "" : "Your phone voice reads the English. "}Tap a highlighted Tagalog word to hear a native speaker${voice ? "" : " say it"}.</p>
    <div class="chat">${coach.log.map((m, i) => m.role === "coach"
      ? `<div class="msg bot"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span style="flex:1;min-width:0">${segHTML(m.segs, i)}</span><button class="speak" data-play="${i}" aria-label="Play again">${SPK}</button></div></div>`
      : `<div class="msg me">${esc(m.text)}</div>`).join("")}
      ${coach.busy ? `<div class="msg bot"><span class="muted">Thinking…</span></div>` : ""}
      ${coach.err ? `<div class="feedback no">${esc(coach.err)}</div>` : ""}
    </div>
    <div class="chips"><button class="chip" data-q="I don't know">I don't know</button><button class="chip" data-q="Please explain that again more simply.">Explain again</button><button class="chip" data-q="Got it. Next step, please.">Next step</button><button class="chip" id="stop">■ Stop voice</button></div>
    <form class="composer" id="kf"><input type="text" id="kIn" autocomplete="off" enterkeyhint="send" placeholder="Answer, or tap 🎤 on your keyboard…" ${coach.busy ? "disabled" : ""}><button class="btn" type="submit" ${coach.busy ? "disabled" : ""}>Send</button></form>`;
  $("#back", el).onclick = () => { stopSpeaking(); coach.topic = null; render(); };
  el.querySelectorAll("[data-play]").forEach(b => b.onclick = () => playCoach(+b.dataset.play));
  $("#stop", el).onclick = stopSpeaking;
  const inp = $("#kIn", el);
  inp.value = coach.draft || "";
  inp.oninput = () => coach.draft = inp.value;
  const send = t => { if (!t || coach.busy) return; stopSpeaking(); coach.log.push({ role: "me", text: t }); coach.draft = ""; coachTurn(t); };
  el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => send(b.dataset.q));
  $("#kf", el).onsubmit = e => { e.preventDefault(); send(inp.value.trim()); };
  if (last < 0 && !coach.busy && !coach.err) coachTurn("(Start the lesson.)");
}

/* ================= TALK (role-play with Claude) ================= */
let samplePromise = null;
function getSample() { if (!samplePromise) samplePromise = window.claude?.use ? claude.use("sample") : Promise.resolve(null); return samplePromise; }
const chats = {};
function viewTalk(el) {
  if (!sub || sub.type !== "chat") {
    el.innerHTML = `
      <h1>Usap</h1>
      <p class="muted">Role-play real situations with an AI partner. Its replies are AI-generated, not checked against a source. It answers in simple Tagalog, gives you the English, and gently corrects your mistakes.</p>
      <div class="tip"><span class="eyebrow">Want a real person?</span><span>Practice the same situations with a Filipino tutor: <a ${EXT} href="${ITALKI}">italki</a> · <a ${EXT} href="${PREPLY}">Preply</a></span></div>
      <div class="card row between"><label for="lvl" class="small">Your level</label>
        <select id="lvl" style="width:auto">${["A1 beginner", "A2 elementary", "B1 intermediate"].map(l => `<option ${S.level === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="story-list">${SCENARIOS.map(s => `<button class="story-item" data-sc="${s.id}"><span class="lvl">${{ sari: "🏪", jeep: "🛺", karinderya: "🍲", lola: "👵", doctor: "🩺", free: "💬" }[s.id]}</span>
        <span><h3>${esc(s.name)}</h3><span class="small muted">${esc(s.open)}</span></span><span class="small muted">›</span></button>`).join("")}</div>
      <p class="small muted">Tip: it's fine to mix in English when you're stuck. Your partner will show you how to say it in Spanish.</p>`;
    $("#lvl", el).onchange = e => { S.level = e.target.value; save(); };
    el.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
      const sc = SCENARIOS.find(s => s.id === b.dataset.sc);
      if (!chats[sc.id]) chats[sc.id] = [{ role: "bot", es: sc.open, en: sc.openEn }];
      sub = { type: "chat", sc: sc.id }; render();
    });
    return;
  }
  const sc = SCENARIOS.find(s => s.id === sub.sc);
  const log = chats[sc.id];
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Scenarios</button><button class="chip" id="reset">Start over</button></div>
    <div><span class="eyebrow">Role-play · ${esc(S.level || "A1 beginner")}</span><h2>${esc(sc.name)}</h2></div>
    <div class="chat" id="chat">${log.map(m => m.role === "bot"
      ? `<div class="msg bot"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span style="flex:1;min-width:0">${esc(m.es)}</span>${speakBtn(m.es)}</div>${m.en ? `<span class="tr">${esc(m.en)}</span>` : ""}${m.fix ? `<span class="fix">✏️ ${esc(m.fix)}</span>` : ""}</div>`
      : `<div class="msg me">${esc(m.es)}</div>`).join("")}
      ${sub.busy ? `<div class="msg bot"><span class="muted">Nagta-type…</span></div>` : ""}
      ${sub.err ? `<div class="feedback no">${esc(sub.err)}</div>` : ""}
    </div>
    <form class="composer" id="cf"><input type="text" id="cIn" autocomplete="off" placeholder="Sumagot sa Tagalog…" ${sub.busy ? "disabled" : ""}><button class="btn" type="submit" ${sub.busy ? "disabled" : ""}>Send</button></form>
    ${accentRow("#cIn")}`;
  wireAccents(el);
  $("#back", el).onclick = () => { sub = null; render(); };
  $("#reset", el).onclick = () => { chats[sc.id] = [{ role: "bot", es: sc.open, en: sc.openEn }]; sub.err = null; render(); };
  const inp = $("#cIn", el);
  if (sub.draft) inp.value = sub.draft;
  inp.oninput = () => sub.draft = inp.value;
  if (!sub.busy) inp.focus({ preventScroll: true });
  $("#cf", el).onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim(); if (!text || sub.busy) return;
    log.push({ role: "me", es: text }); sub.draft = ""; sub.busy = true; sub.err = null; render();
    window.scrollTo(0, document.body.scrollHeight);
    const sample = await getSample();
    if (!sample) { sub.busy = false; sub.err = "Chat needs the Claude app or claude.ai, signed in. Flashcards, stories and drills work everywhere."; log.pop(); sub.draft = text; render(); return; }
    const transcript = log.map(m => (m.role === "bot" ? "Partner: " : "Learner: ") + m.es).join("\n");
    const prompt = `You are ${sc.role}, role-playing with an English-speaking learner of Tagalog (Filipino) at CEFR level ${S.level || "A1 beginner"}.
Rules:
- Stay in character and keep the scene moving. Reply in natural, simple everyday Tagalog suited to the level: 1-3 short sentences, end with a question or prompt so the learner keeps talking.
- Speak the way people in the Philippines really do: use po/opo where the role calls for respect, and common English loanwords (Taglish) only where a Filipino naturally would.
- If the learner's last message has Tagalog mistakes or uses English, write a short, kind correction in English showing the corrected Spanish sentence. If it was correct, set "correction" to "".
Return ONLY JSON: {"reply": "<Tagalog reply>", "english": "<English translation of reply>", "correction": "<correction or empty>"}

Conversation so far:
${transcript}`;
    try {
      const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
      log.push({ role: "bot", es: String(r.reply || "…"), en: String(r.english || ""), fix: String(r.correction || "") });
      addXP(3);
      say(String(r.reply || ""));
    } catch (err) {
      log.pop(); sub.draft = text;
      sub.err = err && err.code === "not_granted" ? "Chat wasn't allowed. You can turn it on from this page's permissions." : err && err.code === "rate_limited" ? "Too many messages at once. Wait a minute and send again." : "Couldn't reach your chat partner. Check your connection and send again.";
    }
    sub.busy = false;
    if (tab === "talk") { render(); window.scrollTo(0, document.body.scrollHeight); }
  };
}

/* boot */
go("home");
booted = true;
