<style>
/* Layout: one-column phone app, sticky top bar, fixed bottom tab bar; talavera-tile blue with saffron highlights */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #e8edf6;
  --fg: #172033;
  --muted: #5b6579;
  --line: #d5dce8;
  --accent: #1d4fb8;      /* azulejo blue */
  --accent-ink: #ffffff;
  --accent-soft: #dce6fb;
  --sun: #f2b01e;         /* saffron */
  --sun-soft: #fdf0cf;
  --good: #1f8a5b;
  --good-soft: #d8f1e5;
  --bad: #c0392b;
  --bad-soft: #f9dcd8;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #18202f; --surface-2: #222c3e; --fg: #e8ecf4; --muted: #9aa5ba; --line: #2d3850;
    --accent: #7ea4ff; --accent-ink: #0d1424; --accent-soft: #233357; --sun: #f5c04a; --sun-soft: #3a3020;
    --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #18202f; --surface-2: #222c3e; --fg: #e8ecf4; --muted: #9aa5ba; --line: #2d3850;
  --accent: #7ea4ff; --accent-ink: #0d1424; --accent-soft: #233357; --sun: #f5c04a; --sun-soft: #3a3020;
  --good: #4fcf94; --good-soft: #17352a; --bad: #ff8a7a; --bad-soft: #3d2020; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.tile { width: 26px; height: 26px; border-radius: 6px; background:
  radial-gradient(circle at 50% 50%, var(--sun) 0 22%, transparent 23%),
  conic-gradient(from 45deg, var(--accent) 0 25%, var(--accent-soft) 0 50%, var(--accent) 0 75%, var(--accent-soft) 0); }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pill.sun { background: var(--sun-soft); border-color: transparent; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
nav.tabs button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

main section { display: grid; gap: 16px; padding-block: 6px 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.sun { background: var(--sun); color: #2a1d00; }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 0.9rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.speak { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.speak svg { width: 20px; height: 20px; fill: currentColor; }

/* home */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 20px; padding: 20px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; opacity: 0.18;
  background: radial-gradient(circle, var(--accent-ink) 0 14%, transparent 15%) 0 0 / 35px 35px; }
.hero .big { font-family: var(--font-display); font-size: 1.55rem; font-weight: 800; line-height: 1.15; }
.meter { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--accent-ink) 25%, transparent); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .4s; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 0.75rem; color: var(--muted); }
.week i { display: block; height: 34px; border-radius: 8px; background: var(--surface-2); margin-bottom: 4px; position: relative; overflow: hidden; }
.week i > s { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); text-decoration: none; }
.week .today { color: var(--fg); font-weight: 700; }
.pod { display: grid; gap: 6px; }
.pod .es { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.action { display: grid; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.action b { font-family: var(--font-display); font-size: 1.05rem; }

/* flashcard */
.deck { text-align: left; display: grid; gap: 6px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.deck .count { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck .bar { height: 6px; border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.deck .bar i { display: block; height: 100%; background: var(--good); }
.flash { perspective: 1200px; min-height: 280px; }
.flash .inner { position: relative; min-height: 280px; transition: transform .45s; transform-style: preserve-3d; }
.flash.flipped .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; }
.face.rear { transform: rotateY(180deg); background: var(--accent-soft); border-color: transparent; }
.face .term { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.face .note { font-size: 0.92rem; color: var(--muted); max-width: 34ch; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { border: 0; border-radius: 12px; padding: 10px 4px; font-weight: 700; display: grid; gap: 1px; background: var(--surface-2); }
.rate button small { font-weight: 400; font-size: 0.75rem; color: var(--muted); }
.rate .again { background: var(--bad-soft); }
.rate .good { background: var(--good-soft); }
@media (prefers-reduced-motion: reduce) { .flash .inner, .meter > i { transition: none; } }

/* stories */
.story-list { display: grid; gap: 10px; }
.story-item { text-align: left; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.lvl { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--sun-soft); }
.done-tag { font-size: 0.75rem; font-weight: 700; color: var(--good); }
.sent { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 10px; font-size: 1.12rem; line-height: 1.55; }
.sent:hover { background: var(--surface-2); }
.sent .en { display: block; font-size: 0.92rem; color: var(--muted); margin-top: 4px; font-style: italic; }
.sent.speaking { background: var(--sun-soft); }
.gloss { display: grid; gap: 6px; }
.gloss-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gloss-row:last-child { border-bottom: 0; }
.gloss-row .w { font-weight: 700; flex: 1; min-width: 0; }
.add { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; font-size: 0.82rem; font-weight: 700; }
.add[disabled] { color: var(--good); border-color: transparent; background: var(--good-soft); }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 1.02rem; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.prompt-big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
input[type="text"], textarea, select { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.conj { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.conj td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.conj td:first-child { color: var(--muted); width: 45%; }
.accents { display: flex; gap: 6px; flex-wrap: wrap; }
.accents button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 38px; padding: 6px 8px; font-weight: 700; }

/* phrasebook */
.phrase { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.phrase:last-child { border-bottom: 0; }
.phrase .txt { flex: 1; min-width: 0; }
.phrase .txt b { display: block; font-size: 1.05rem; }
.phrase .txt span { color: var(--muted); font-size: 0.92rem; }

/* chat */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; display: grid; gap: 6px; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: end; border-bottom-right-radius: 4px; }
.msg .tr { font-size: 0.88rem; color: var(--muted); font-style: italic; }
.msg .fix { font-size: 0.88rem; background: var(--sun-soft); border-radius: 8px; padding: 6px 8px; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; justify-self: start; }
.tip { background: var(--sun-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
</style>

</nav>

const DAY = 864e5;
const today = () => new Date().toISOString().slice(0, 10);
const LS_KEY = "hablaya.v1";
const blank = () => ({ cards: {}, days: {}, streak: { last: null, count: 0 }, mine: [], storiesDone: [], dir: "es-en", goal: 30, newPerDay: 10, newToday: { d: null, n: 0 } });
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let progressDoc = null;   // db doc when signed in
let saveTimer = null, saving = false, saveAgain = false;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!progressDoc) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush() {
  if (!progressDoc) return;
  if (saving) { saveAgain = true; return; }
  saving = true;
  try { await progressDoc.set({ state: JSON.stringify(S), at: Date.now() }); } catch (e) {}
  saving = false;
  if (saveAgain) { saveAgain = false; flush(); }
}
(async () => {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection("data/users/" + id).doc("progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    progressDoc = ref;
    if (remote && remote.state) {
      const r = JSON.parse(remote.state);
      if (countReviews(r) >= countReviews(S)) { S = Object.assign(blank(), r); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} render(); }
      else flush();
    } else if (countReviews(S) > 0) flush();
  } catch (e) {}
})();
function countReviews(s) { return Object.values(s.days || {}).reduce((a, b) => a + b, 0) + Object.keys(s.cards || {}).length; }

function addXP(n) {
  const d = today();
  S.days[d] = (S.days[d] || 0) + n;
  if (S.streak.last !== d) {
    const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
    S.streak.count = S.streak.last === y ? S.streak.count + 1 : 1;
    S.streak.last = d;
  }
  save(); updatePills();
}
function streakNow() {
  const y = new Date(Date.now() - DAY).toISOString().slice(0, 10);
  return (S.streak.last === today() || S.streak.last === y) ? S.streak.count : 0;
}
function updatePills() {
  $("#streakPill").textContent = "🔥 " + streakNow();
  $("#xpPill").textContent = (S.days[today()] || 0) + " pts";
}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[¿?¡!.,]/g, "").replace(/\s+/g, " ").trim();
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function speakBtn(text) { return `<button class="speak" data-say="${esc(text)}" aria-label="Listen: ${esc(text)}">${SPK}</button>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
    voice = vs.find(v => /es-(mx|us|419)/i.test(v.lang)) || vs.find(v => /es-es/i.test(v.lang)) || vs[0] || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(text, rate = 0.9, onend) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[—«»]/g, " "));
    u.lang = voice ? voice.lang : "es-ES"; if (voice) u.voice = voice; u.rate = rate;
    if (onend) u.onend = onend;
    speechSynthesis.speak(u);
  } catch (e) { toast("Audio isn't available on this device"); }
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) { e.stopPropagation(); say(b.dataset.say); } });

function allDecks() {
  const d = DECKS.slice();
  if (S.mine.length) d.push({ id: "mine", name: "My words", es: "Mis palabras", cards: S.mine });
  return d;
}
function cardState(es) { return S.cards[es]; }
function isDue(es) { const c = S.cards[es]; return c && c.due <= Date.now(); }
function dueCount(deck) { return deck.cards.filter(c => isDue(c[0])).length; }
function learnedCount(deck) { return deck.cards.filter(c => S.cards[c[0]]).length; }
function totalDue() { return allDecks().reduce((a, d) => a + dueCount(d), 0); }
function newLeft() { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; return Math.max(0, S.newPerDay - S.newToday.n); }

function addMine(es, en) {
  if (S.mine.some(m => m[0] === es) || DECKS.some(d => d.cards.some(c => c[0] === es))) return false;
  S.mine.push([es, en]); save(); return true;
}

function buildQueue(deckId) {
  const decks = deckId === "all" ? allDecks() : allDecks().filter(d => d.id === deckId);
  const cards = decks.flatMap(d => d.cards);
  const due = shuffle(cards.filter(c => isDue(c[0])));
  let fresh = cards.filter(c => !S.cards[c[0]]);
  if (deckId === "all") fresh = DECKS.flatMap(d => d.cards).filter(c => !S.cards[c[0]]).concat(S.mine.filter(c => !S.cards[c[0]]));
  fresh = fresh.slice(0, newLeft());
  return due.concat(fresh);
}
function schedule(es, grade) { // grade: 0 again, 1 hard, 2 good, 3 easy
  const isNew = !S.cards[es];
  const c = S.cards[es] || { iv: 0, ease: 2.5, reps: 0, due: 0 };
  if (isNew) { if (S.newToday.d !== today()) S.newToday = { d: today(), n: 0 }; S.newToday.n++; }
  if (grade === 0) { c.iv = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = Date.now() + 60e3; }
  else {
    if (grade === 1) { c.iv = Math.max(1, Math.round(c.iv * 1.2)); c.ease = Math.max(1.3, c.ease - 0.15); }
    if (grade === 2) c.iv = c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease);
    if (grade === 3) { c.iv = c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3); c.ease += 0.15; }
    c.due = Date.now() + c.iv * DAY - 3600e3;
  }
  c.reps++;
  S.cards[es] = c;
}
function previewIv(es, g) {
  const c = S.cards[es] || { iv: 0, ease: 2.5 };
  if (g === 0) return "1 min";
  const iv = g === 1 ? Math.max(1, Math.round(c.iv * 1.2)) : g === 2 ? (c.iv === 0 ? 1 : c.iv === 1 ? 3 : Math.round(c.iv * c.ease)) : (c.iv === 0 ? 4 : Math.round(c.iv * c.ease * 1.3));
  return iv < 30 ? iv + "d" : Math.round(iv / 30) + "mo";
}
function viewStudy(el) {

  const isNew = !S.cards[c[0]];

function quizPool(deckId) {
  const decks = deckId && deckId !== "all" ? allDecks().filter(d => d.id === deckId) : allDecks();
  let pool = decks.flatMap(d => d.cards);
  const learned = pool.filter(c => S.cards[c[0]]);
  if (learned.length >= 10 && deckId === "all") pool = learned;
  return pool;
}
function viewQuiz(el, listen) {
  if (!sub.items) {
    const pool = quizPool(sub.deck);
    const all = DECKS.flatMap(d => d.cards);
    sub.items = shuffle(pool).slice(0, 10).map(c => {
      const rev = !listen && Math.random() < 0.5;
      const distract = shuffle(all.filter(x => x[0] !== c[0])).slice(0, 3);
      const opts = shuffle([c, ...distract]);
      return { c, rev, opts, ans: opts.indexOf(c) };
    });
    sub.i = 0; sub.score = 0; sub.picked = null;
  }
  const back = () => { sub = null; render(); };
  if (sub.i >= sub.items.length) {
    el.innerHTML = `<div class="card empty"><span class="eyebrow">${listen ? "Ear training" : "Quick quiz"}</span><h2>${sub.score}/${sub.items.length}</h2>
      <p class="muted">${sub.score >= 9 ? "¡Excelente!" : sub.score >= 6 ? "¡Bien hecho! Keep reviewing." : "Keep going. Missed phrases will stick with more flashcard reviews."}</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Another round</button><button class="btn ghost" id="b">Done</button></div></div>`;
    $("#again", el).onclick = () => { sub = { type: sub.type, deck: sub.deck }; render(); };
    $("#b", el).onclick = back;
    return;
  }
  const it = sub.items[sub.i];
  const promptTxt = listen ? "" : it.rev ? it.c[1] : it.c[0];
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Practice</button><span class="small muted">${sub.i + 1} / ${sub.items.length} · ${sub.score} right</span></div>
    <div class="card" style="display:grid;gap:12px;justify-items:start">
      <span class="eyebrow">${listen ? "What did you hear?" : it.rev ? "How do you say this in Spanish?" : "What does this mean?"}</span>
      ${listen ? `<button class="btn" id="replay">▶ Play again</button><button class="chip" id="slow">Play slowly</button>` : `<div class="prompt-big">${esc(promptTxt)}</div>${!it.rev ? speakBtn(it.c[0]) : ""}`}
    </div>
    <div class="opts">${it.opts.map((o, i) => {
      const cls = sub.picked === null ? "" : i === it.ans ? "right" : i === sub.picked ? "wrong" : "";
      return `<button class="opt ${cls}" data-o="${i}" ${sub.picked !== null ? "disabled" : ""}>${esc(it.rev ? o[0] : o[1])}</button>`;
    }).join("")}</div>
    ${sub.picked !== null ? `<div class="card row between"><span><b>${esc(it.c[0])}</b> <span class="muted">— ${esc(it.c[1])}</span></span>${speakBtn(it.c[0])}</div><button class="btn block" id="next">Next</button>` : ""}`;
  $("#back", el).onclick = back;
  if (listen) {
    $("#replay", el).onclick = () => say(it.c[0]);
    $("#slow", el).onclick = () => say(it.c[0], 0.6);
    if (sub.picked === null) setTimeout(() => say(it.c[0]), 200);
  }
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    sub.picked = +b.dataset.o;
    if (sub.picked === it.ans) { sub.score++; addXP(2); }
    else if (S.cards[it.c[0]]) { S.cards[it.c[0]].due = Date.now(); save(); }
    if (!listen) say(it.c[0]);
    render();
  });
  const n = $("#next", el); if (n) n.onclick = () => { sub.i++; sub.picked = null; render(); };
}

function accentRow(inputSel) {

}
function wireAccents(el) {

    const inp = $(b.dataset.for, el); const p = inp.selectionStart ?? inp.value.length;
    inp.value = inp.value.slice(0, p) + b.dataset.acc + inp.value.slice(inp.selectionEnd ?? p); inp.focus(); inp.setSelectionRange(p + 1, p + 1);
  });
}
function checkAnswer(given, target) {
  const g = given.trim().toLowerCase().replace(/[¿?¡!.,]/g, "").replace(/\s+/g, " ");
  const t = target.toLowerCase().replace(/[¿?¡!.,…]/g, "").replace(/\s+/g, " ").trim();
  if (g === t) return "exact";
  if (norm(given) === norm(target)) return "accent";
  return "wrong";
}

    sub.i = 0; sub.score = 0; sub.result = null;
  }
  const back = () => { sub = null; render(); };
  if (sub.i >= sub.items.length) {
    el.innerHTML = `<div class="card empty"><span class="eyebrow">Write it</span><h2>${sub.score}/${sub.items.length}</h2><p class="muted">Typing from memory is the hardest skill. Every right answer counts double.</p>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Another round</button><button class="btn ghost" id="b">Done</button></div></div>`;
    $("#again", el).onclick = () => { sub = { type: "write" }; render(); };
    $("#b", el).onclick = back; return;
  }
  const c = sub.items[sub.i];
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Practice</button><span class="small muted">${sub.i + 1} / ${sub.items.length} · ${sub.score} right</span></div>
    <div class="card" style="display:grid;gap:12px"><span class="eyebrow">Write in Spanish</span><div class="prompt-big">${esc(c[1])}</div></div>
    <form id="wf" style="display:grid;gap:10px">
      <input type="text" id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…" ${sub.result ? "disabled" : ""}>
      ${accentRow("#wIn")}
      ${sub.result ? "" : `<div class="row"><button class="btn" type="submit">Check</button><button class="btn ghost" type="button" id="skip">I don't know</button></div>`}
    </form>
    ${sub.result ? `<div class="feedback ${sub.result === "wrong" ? "no" : "ok"}">${sub.result === "exact" ? "¡Correcto!" : sub.result === "accent" ? "Right! Watch the accents:" : "Not quite. The answer:"} ${esc(c[0])}</div>
      <div class="row">${speakBtn(c[0])}<button class="btn" id="next" style="flex:1">Next</button></div>` : ""}`;
  $("#back", el).onclick = back;
  wireAccents(el);
  const inp = $("#wIn", el); if (sub.result) inp.value = sub.given || ""; else inp.focus();
  $("#wf", el).onsubmit = e => {
    e.preventDefault(); if (sub.result || !inp.value.trim()) return;
    sub.given = inp.value; sub.result = checkAnswer(inp.value, c[0]);
    if (sub.result !== "wrong") { sub.score++; addXP(4); } say(c[0]); render();
  };
  const sk = $("#skip", el); if (sk) sk.onclick = () => { sub.given = ""; sub.result = "wrong"; say(c[0]); render(); };
  const n = $("#next", el); if (n) n.onclick = () => { sub.i++; sub.result = null; render(); };
}

function viewVerbs(el) {
  if (!sub.mode) { sub.mode = "drill"; sub.tense = "present"; sub.verb = "all"; }
  const back = () => { sub = null; render(); };
  const names = Object.keys(VERBS);
  const head = `
    <div class="row between"><button class="back" id="back">‹ Practice</button><span class="small muted">${sub.score || 0} right this session</span></div>
    <h1>Verbos</h1>
    <div class="chips"><button class="chip" data-t="present" aria-pressed="${sub.tense === "present"}">Present</button><button class="chip" data-t="past" aria-pressed="${sub.tense === "past"}">Past (preterite)</button>
      <button class="chip" data-v="table" aria-pressed="${sub.mode === "table"}">Show tables</button></div>`;
  if (sub.mode === "table") {
    el.innerHTML = head + names.map(v => `<div class="card"><div class="row between"><h3>${v} <span class="muted small" style="font-weight:400">${esc(VERBS[v].en)}</span></h3>${speakBtn(VERBS[v][sub.tense].join(", "))}</div>
      <table class="conj">${PERSONS.map((p, i) => `<tr><td>${p}</td><td><b>${VERBS[v][sub.tense][i]}</b></td></tr>`).join("")}</table></div>`).join("");
  } else {
    if (!sub.q || sub.q.tense !== sub.tense) {
      const v = names[Math.floor(Math.random() * names.length)], p = Math.floor(Math.random() * 5);
      sub.q = { v, p, tense: sub.tense }; sub.result = null;
    }
    const { v, p } = sub.q, ans = VERBS[v][sub.tense][p];
    el.innerHTML = head + `
      <div class="card" style="display:grid;gap:8px"><span class="eyebrow">${sub.tense === "present" ? "Present tense" : "Past tense (preterite)"}</span>
        <div class="prompt-big">${PERSONS[p].split(" / ")[0]} · ${v}</div><span class="muted">${esc(VERBS[v].en)}${p >= 2 ? ` · this form also covers ${PERSONS[p].split(" / ").slice(1).join(" and ")}` : ""}</span></div>
      <form id="vf" style="display:grid;gap:10px">
        <input type="text" id="vIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Conjugate…" ${sub.result ? "disabled" : ""}>
        ${accentRow("#vIn")}
        ${sub.result ? "" : `<button class="btn" type="submit">Check</button>`}
      </form>
      ${sub.result ? `<div class="feedback ${sub.result === "wrong" ? "no" : "ok"}">${sub.result === "exact" ? "¡Correcto!" : sub.result === "accent" ? "Right, but watch the accent:" : "The answer is"} ${PERSONS[p].split(" / ")[0]} ${ans}</div>
        <div class="card"><table class="conj">${PERSONS.map((pp, i) => `<tr><td>${pp}</td><td>${i === p ? `<b>${VERBS[v][sub.tense][i]}</b>` : VERBS[v][sub.tense][i]}</td></tr>`).join("")}</table></div>
        <button class="btn block" id="next">Next verb</button>` : ""}`;
    wireAccents(el);
    const inp = $("#vIn", el); if (sub.result) inp.value = sub.given || ""; else inp.focus();
    $("#vf", el).onsubmit = e => {
      e.preventDefault(); if (sub.result || !inp.value.trim()) return;
      sub.given = inp.value; sub.result = checkAnswer(inp.value, ans);
      if (sub.result !== "wrong") { sub.score = (sub.score || 0) + 1; addXP(2); }
      say(PERSONS[p].split(" / ")[0] + " " + ans); render();
    };
    const n = $("#next", el); if (n) n.onclick = () => { sub.q = null; render(); };
  }
  $("#back", el).onclick = back;
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { sub.tense = b.dataset.t; sub.q = null; render(); });
  $("[data-v]", el).onclick = () => { sub.mode = sub.mode === "table" ? "drill" : "table"; render(); };
}

/* ================= TALK (role-play with Claude) ================= */
let samplePromise = null;
function getSample() { if (!samplePromise) samplePromise = window.claude?.use ? claude.use("sample") : Promise.resolve(null); return samplePromise; }
const chats = {};
function viewTalk(el) {
  if (!sub || sub.type !== "chat") {
    el.innerHTML = `
      <h1>Hablar</h1>
      <p class="muted">Role-play real situations with an AI partner. It answers in simple Spanish, gives you the English, and gently corrects your mistakes.</p>
      <div class="card row between"><label for="lvl" class="small">Your level</label>
        <select id="lvl" style="width:auto">${["A1 beginner", "A2 elementary", "B1 intermediate"].map(l => `<option ${S.level === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="story-list">${SCENARIOS.map(s => `<button class="story-item" data-sc="${s.id}"><span class="lvl">${{ cafe: "☕", hotel: "🛎", street: "🧭", doctor: "🩺", friend: "👋", free: "💬" }[s.id]}</span>
        <span><h3>${esc(s.name)}</h3><span class="small muted">${esc(s.open)}</span></span><span class="small muted">›</span></button>`).join("")}</div>
      <p class="small muted">Tip: it's fine to mix in English when you're stuck. Your partner will show you how to say it in Spanish.</p>`;
    $("#lvl", el).onchange = e => { S.level = e.target.value; save(); };
    el.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => {
      const sc = SCENARIOS.find(s => s.id === b.dataset.sc);
      if (!chats[sc.id]) chats[sc.id] = [{ role: "bot", es: sc.open, en: sc.openEn }];
      sub = { type: "chat", sc: sc.id }; render();
    });
    return;
  }
  const sc = SCENARIOS.find(s => s.id === sub.sc);
  const log = chats[sc.id];
  el.innerHTML = `
    <div class="row between"><button class="back" id="back">‹ Scenarios</button><button class="chip" id="reset">Start over</button></div>
    <div><span class="eyebrow">Role-play · ${esc(S.level || "A1 beginner")}</span><h2>${esc(sc.name)}</h2></div>
    <div class="chat" id="chat">${log.map(m => m.role === "bot"
      ? `<div class="msg bot"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:8px"><span style="flex:1;min-width:0">${esc(m.es)}</span>${speakBtn(m.es)}</div>${m.en ? `<span class="tr">${esc(m.en)}</span>` : ""}${m.fix ? `<span class="fix">✏️ ${esc(m.fix)}</span>` : ""}</div>`
      : `<div class="msg me">${esc(m.es)}</div>`).join("")}
      ${sub.busy ? `<div class="msg bot"><span class="muted">Escribiendo…</span></div>` : ""}
      ${sub.err ? `<div class="feedback no">${esc(sub.err)}</div>` : ""}
    </div>
    <form class="composer" id="cf"><input type="text" id="cIn" autocomplete="off" placeholder="Responde en español…" ${sub.busy ? "disabled" : ""}><button class="btn" type="submit" ${sub.busy ? "disabled" : ""}>Send</button></form>
    ${accentRow("#cIn")}`;
  wireAccents(el);
  $("#back", el).onclick = () => { sub = null; render(); };
  $("#reset", el).onclick = () => { chats[sc.id] = [{ role: "bot", es: sc.open, en: sc.openEn }]; sub.err = null; render(); };
  const inp = $("#cIn", el);
  if (sub.draft) inp.value = sub.draft;
  inp.oninput = () => sub.draft = inp.value;
  if (!sub.busy) inp.focus({ preventScroll: true });
  $("#cf", el).onsubmit = async e => {
    e.preventDefault();
    const text = inp.value.trim(); if (!text || sub.busy) return;
    log.push({ role: "me", es: text }); sub.draft = ""; sub.busy = true; sub.err = null; render();
    window.scrollTo(0, document.body.scrollHeight);
    const sample = await getSample();
    if (!sample) { sub.busy = false; sub.err = "Chat needs the Claude app or claude.ai, signed in. Flashcards, stories and drills work everywhere."; log.pop(); sub.draft = text; render(); return; }
    const transcript = log.map(m => (m.role === "bot" ? "Partner: " : "Learner: ") + m.es).join("\n");
    const prompt = `You are ${sc.role}, role-playing with an English-speaking Spanish learner at CEFR level ${S.level || "A1 beginner"}.
Rules:
- Stay in character and keep the scene moving. Reply in natural, simple Spanish suited to the level: 1-3 short sentences, end with a question or prompt so the learner keeps talking.
- Use everyday Latin American or Spain Spanish as fits the setting.
- If the learner's last message has Spanish mistakes or uses English, write a short, kind correction in English showing the corrected Spanish sentence. If it was correct, set "correction" to "".
Return ONLY JSON: {"reply": "<Spanish reply>", "english": "<English translation of reply>", "correction": "<correction or empty>"}

Conversation so far:
${transcript}`;
    try {
      const r = await sample.json(prompt, { cache: false, modelTier: "quick" });
      log.push({ role: "bot", es: String(r.reply || "…"), en: String(r.english || ""), fix: String(r.correction || "") });
      addXP(3);
      say(String(r.reply || ""));
    } catch (err) {
      log.pop(); sub.draft = text;
      sub.err = err && err.code === "not_granted" ? "Chat wasn't allowed. You can turn it on from this page's permissions." : err && err.code === "rate_limited" ? "Too many messages at once. Wait a minute and send again." : "Couldn't reach your chat partner. Check your connection and send again.";
    }
    sub.busy = false;
    if (tab === "talk") { render(); window.scrollTo(0, document.body.scrollHeight); }
  };
}

/* boot */
go("home");
</script>
